                                    <div style="font-size: 0.72rem; color: #b45309; margin-bottom: 0.375rem;" x-text="ssPersonSearchTotal + ' matches — showing ' + ssPersonSearchResults.length + ', refine your search to narrow it down'"></div>
                                </template>
                                <template x-if="ssPersonSearchResults.length > 0">
                                    <div style="margin-bottom: 1rem; max-height: 200px; overflow-y: auto; overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 6px;">
                                        <table class="admin-table" style="margin: 0; font-size: 0.8rem;">
                                            <thead><tr>
                                                <th class="sortable" @click="sortSsPersonSearch('person_id')" :aria-sort="NSS.sortAria(ssPersonSearchSortBy, ssPersonSearchSortDir, 'person_id')">Person ID<span class="sort-ind" x-text="NSS.sortIcon(ssPersonSearchSortBy, ssPersonSearchSortDir, 'person_id')"></span></th>
                                                <th class="sortable" @click="sortSsPersonSearch('person_name')" :aria-sort="NSS.sortAria(ssPersonSearchSortBy, ssPersonSearchSortDir, 'person_name')">Name<span class="sort-ind" x-text="NSS.sortIcon(ssPersonSearchSortBy, ssPersonSearchSortDir, 'person_name')"></span></th>
                                                <th class="sortable" @click="sortSsPersonSearch('mobile_number')" :aria-sort="NSS.sortAria(ssPersonSearchSortBy, ssPersonSearchSortDir, 'mobile_number')">Mobile<span class="sort-ind" x-text="NSS.sortIcon(ssPersonSearchSortBy, ssPersonSearchSortDir, 'mobile_number')"></span></th>
                                                <th class="sortable" @click="sortSsPersonSearch('email')" :aria-sort="NSS.sortAria(ssPersonSearchSortBy, ssPersonSearchSortDir, 'email')">Email<span class="sort-ind" x-text="NSS.sortIcon(ssPersonSearchSortBy, ssPersonSearchSortDir, 'email')"></span></th>
                                                <th></th>
                                            </tr></thead>
                                            <tbody>
                                                <template x-for="p in sortedSsPersonSearchResults()" :key="p.person_pk">
                                                    <tr :style="p._already_ss ? 'background: #fef2f2; opacity: 0.7; cursor: default;'
                                                              : p._pending_claim ? 'background: #fffbeb; opacity: 0.85; cursor: default;'
                                                              : (ssForm.person_pk === p.person_pk ? 'background: #fef3c7; cursor: pointer;' : 'cursor: pointer;')"
                                                        @click="!p._already_ss && !p._pending_claim && selectPersonForSS(p)">
                                                        <td style="font-family: monospace;" x-text="p.person_id"></td>
                                                        <td>
                                                            <span x-text="[p.first_name, p.middle_name, p.last_name].filter(Boolean).join(' ')"></span>
                                                            <template x-if="p._already_ss">
                                                                <span style="display: inline-block; font-size: 0.65rem; background: #dc2626; color: #fff; padding: 1px 6px; border-radius: 10px; margin-left: 6px; font-weight: 600;"
                                                                      x-text="'SS: ' + p._existing_ss_id"></span>
                                                            </template>
                                                            <template x-if="p._pending_claim && !p._already_ss">
                                                                <span style="display: inline-block; font-size: 0.65rem; background: #d97706; color: #fff; padding: 1px 6px; border-radius: 10px; margin-left: 6px; font-weight: 600;">Pending Approval</span>
                                                            </template>
                                                        </td>
                                                        <td x-text="p.mobile_number || '—'"></td>
                                                        <td x-text="p.email || '—'"></td>
                                                        <td>
                                                            <!-- Normal: Select button -->
                                                            <template x-if="!p._already_ss && !p._pending_claim">
                                                                <button class="btn-action" style="font-size: 0.7rem;"
                                                                        @click.stop="selectPersonForSS(p)">Select</button>
                                                            </template>
                                                            <!-- Already SS -->
                                                            <template x-if="p._already_ss">
                                                                <span style="font-size: 0.7rem; color: #6b7280;">Already SS</span>
                                                            </template>
                                                            <!-- Pending claim: show "View Claim" if user can approve -->
                                                            <template x-if="p._pending_claim && !p._already_ss && canApproveClaims">
                                                                <button class="btn-action" style="font-size: 0.7rem; background: #d97706; color: #fff; border-color: #d97706;"
                                                                        @click.stop="activeTab = 'claims'; $nextTick(() => viewClaim(p._pending_claim_pk))">
                                                                    View &amp; Approve
                                                                </button>
                                                            </template>
                                                            <template x-if="p._pending_claim && !p._already_ss && !canApproveClaims">
                                                                <span style="font-size: 0.7rem; color: #92400e;">Pending</span>
                                                            </template>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                                <template x-if="ssPersonSearchResults.length === 0 && ssPersonSearchDone">
                                    <div style="font-size: 0.8rem; color: #6b7280; margin-bottom: 0.75rem;">
                                        No persons found. Create a person first via the "Create Person" tab.
                                    </div>
                                </template>

                                <!-- Selected Person -->
                                <template x-if="ssForm.person_pk">
                                    <div :style="ssSelectedPerson.already_ss ? 'background: #fef2f2; border: 1px solid #fecaca;' : 'background: #f0fdf4; border: 1px solid #86efac;'"
                                         style="border-radius: 6px; padding: 0.75rem; margin-bottom: 1rem;">
                                        <div style="display: flex; justify-content: space-between; align-items: start;">
                                            <div>
                                                <div style="font-weight: 600; font-size: 0.85rem;" x-text="ssSelectedPerson.person_name"></div>
                                                <div style="font-size: 0.75rem; color: #6b7280;" x-text="ssSelectedPerson.person_id"></div>
                                                <div x-show="ssSelectedPerson.already_ss"
                                                     style="font-size: 0.8rem; color: #dc2626; font-weight: 600; margin-top: 0.35rem;">
                                                    ⚠ Already a Sangha Sevi — ID: <span x-text="ssSelectedPerson.existing_ss_id"></span>
                                                </div>
                                            </div>
                                            <button class="btn-action" style="font-size: 0.7rem;" @click="ssForm.person_pk = ''; ssSelectedPerson = {}; ssError = '';">Clear</button>
                                        </div>
                                    </div>
                                </template>

                                <!-- ── Step 2: Sangha Sevi Details ── -->
                                <template x-if="ssForm.person_pk && !ssSelectedPerson.already_ss">
                                    <div>
                                        <h3 style="font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: #0D7377;">
                                            Step 2: Membership Details
                                        </h3>

                                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                                            <div class="form-group">
                                                <label class="form-label">Membership Type *</label>
                                                <select class="nss-select" x-model="ssForm.membership_type_pk">
                                                    <option value="">Select...</option>
                                                    <template x-for="mt in membershipTypes" :key="mt.master_data_pk">
                                                        <option :value="mt.master_data_pk" x-text="mt.value_name"></option>
                                                    </template>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label class="form-label">Organization (Sakha) *</label>
                                                <select class="nss-select" x-model="ssForm.organization_pk"
                                                        :disabled="sakhaScope.mode === 'locked'">
                                                    <option value="">Select...</option>
                                                    <template x-for="org in sakhaOrgs" :key="org.organization_pk">
                                                        <option :value="org.organization_pk"
                                                                x-text="org.organization_name"></option>
                                                    </template>
                                                </select>
                                                <p class="form-hint" x-show="sakhaScope.mode === 'locked'">Auto-selected — this is the only Sakha in your scope.</p>
                                            </div>
                                            <div class="form-group" x-data="nssDatePicker('ssForm.joining_date')" style="position: relative;">
                                                <label class="form-label">Sangha Joining Date</label>
                                            </div>
                                            <div class="form-group">
                                                <label class="form-label">Local Sakha Number</label>
                                                <div style="display: flex; align-items: center; gap: 0.5rem;">
                                                    <span style="font-weight: 600; color: #0D7377; font-size: 0.85rem; white-space: nowrap;"
                                                          x-text="sakhaShortCode(ssForm.organization_pk)"></span>
                                                    <input type="number" class="form-input" x-model="ssForm.local_sakha_number"
                                                           placeholder="e.g. 1192" min="1" style="flex: 1;">
                                                </div>
                                                <div class="form-hint" x-show="ssForm.local_sakha_number && ssForm.organization_pk"
                                                     x-text="'ERP ID: ' + sakhaShortCode(ssForm.organization_pk) + ssForm.local_sakha_number"
                                                     style="font-size: 0.75rem; color: #6b7280; margin-top: 0.25rem;"></div>
                                                <div class="form-hint"
                                                     x-show="sakhaMissingShortCode(ssForm.organization_pk)"
                                                     style="font-size: 0.75rem; color: #D64A6A; margin-top: 0.25rem;">
                                                    This Sakha has no short_code assigned yet. An NSS admin must set it first.
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Mandatory credential (MBR-010/014/019A/B): Anumati Patra for
                                             Probationary, Parichaya Patra for Regular/Associate. -->
                                        <template x-if="ssForm.membership_type_pk">
                                        <div class="form-group" style="margin-top: 0.5rem; border-top: 1px solid #e5e7eb; padding-top: 0.75rem;">
                                            <label class="form-checkbox-row">
                                                <input type="checkbox" class="nss-checkbox" x-model="ssForm.credential_is_legacy">
                                                <span x-text="'This member already has a ' + credentialLabelFor(ssForm.membership_type_pk) + ' (legacy — enter its number)'"></span>
                                            </label>
                                            <template x-if="!ssForm.credential_is_legacy">
                                                <p class="form-hint">
                                                    A new <span x-text="credentialLabelFor(ssForm.membership_type_pk)"></span> number will be auto-generated on submit. Validity runs Dola Purnima to Dola Purnima (SOL-ARCH-013 FC-DECISION-01) — no issue date or year is entered by hand.
                                                </p>
                                            </template>
                                            <template x-if="ssForm.credential_is_legacy">
                                                <div class="form-group" style="margin-top: 0.5rem;">
                                                    <label class="form-label" x-text="credentialLabelFor(ssForm.membership_type_pk) + ' Number *'"></label>
                                                    <input type="text" class="form-input" x-model="ssForm.credential_document_number"
                                                           placeholder="e.g. 1, or 345/2025/2026 — as written on the old register" maxlength="30">
                                                </div>
                                            </template>
                                        </div>
                                        </template>

                                        <!-- Optional bundled login account. Login is by
                                             sangha_sevi_id, so the SS flow is the right home for
                                             account creation. Only shown to admins who can create
                                             accounts (ADMIN_USER_MANAGE); the backend enforces it. -->
                                        <template x-if="canCreateAccounts">
                                            <div style="margin-top: 0.25rem; border-top: 1px solid #e5e7eb; padding-top: 0.75rem;">
                                                <div class="form-group">
                                                    <label class="form-checkbox-row">
                                                        <input type="checkbox" class="nss-checkbox" x-model="ssForm.create_user_account">
                                                        Also create a login account for this member
                                                    </label>
                                                    <p class="form-hint">Login is by Sangha Sevi ID — the account becomes usable as soon as this record is created.</p>
                                                </div>

                                                <template x-if="ssForm.create_user_account">
                                                    <div>
                                                        <div class="form-group">
                                                            <label class="form-label">Initial Password *</label>
                                                            <input type="password" class="form-input" x-model="ssForm.password"
                                                                   placeholder="Min 8 chars, 1 uppercase, 1 digit"
                                                                   autocomplete="new-password">
                                                        </div>
                                                        <div class="form-group">
                                                            <label class="form-checkbox-row">
                                                                <input type="checkbox" class="nss-checkbox" x-model="ssForm.force_password_change">
                                                                Force password change on first login
                                                            </label>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <button class="btn-action primary" style="margin-top: 0.5rem;"
                                                @click="createSanghaSevi()"
                                                :disabled="ssLoading || !ssForm.person_pk || !ssForm.membership_type_pk || !ssForm.organization_pk ||
                                                           (ssForm.create_user_account && !ssForm.password) ||
                                                           (ssForm.credential_is_legacy && !ssForm.credential_document_number.trim())">
                                            <div class="spinner-sm" x-show="ssLoading"></div>
                                            <span x-text="ssLoading ? 'Creating...' : 'Create Sangha Sevi'"></span>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- ═══════════════════════════════════════════
                         VIEW: Change Own Password
                         ═══════════════════════════════════════════ -->
                    <div x-show="activeTab === 'password'">
                        <div class="data-card" style="max-width: 480px;">
                            <div class="data-card-header">
                                <h2 class="data-card-title">Change Your Password</h2>
                            </div>
                            <div class="data-card-body">
                                <template x-if="pwError">
                                    <div class="alert-msg alert-error" x-text="pwError"></div>
                                </template>
                                <template x-if="pwSuccess">
                                    <div class="alert-msg alert-success" x-text="pwSuccess"></div>
                                </template>

                                <div class="form-group">
                                    <label class="form-label">Current Password</label>
                                    <input type="password" class="form-input" x-model="pwForm.current_password"
                                           autocomplete="current-password">
                                </div>

                                <div class="form-group">
                                    <label class="form-label">New Password</label>
                                    <input type="password" class="form-input" x-model="pwForm.new_password"
                                           placeholder="Min 8 chars, 1 uppercase, 1 digit"
                                           autocomplete="new-password">
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Confirm New Password</label>
                                    <input type="password" class="form-input" x-model="pwForm.confirm_password"
                                           autocomplete="new-password">
                                </div>

                                <div class="form-hint" style="margin-bottom: 0.75rem;">
                                    Requirements: 8-128 characters, at least 1 uppercase letter, at least 1 digit.
                                </div>

                                <button class="btn-action primary"
                                        @click="changeOwnPassword()"
                                        :disabled="pwLoading || !pwForm.current_password || !pwForm.new_password || !pwForm.confirm_password">
                                    <div class="spinner-sm" x-show="pwLoading"></div>
                                    <span x-text="pwLoading ? 'Changing...' : 'Change Password'"></span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- ═══════════════════════════════════════════
                         VIEW: Create Organization (NSS_ERP_ADMIN only)
                         ═══════════════════════════════════════════ -->
                    <div x-show="activeTab === 'createOrg'" x-cloak>
                        <div class="data-card" style="max-width: 640px;">
                            <div class="data-card-header">
                                <h2 class="data-card-title">Create New Organization</h2>
                            </div>
                            <div class="data-card-body">
                                <template x-if="createOrgError">
                                    <div class="alert-msg alert-error" x-text="createOrgError"></div>
                                </template>
                                <template x-if="createOrgSuccess">
                                    <div class="alert-msg alert-success" x-text="createOrgSuccess"></div>
                                </template>

                                <!-- Organization Name -->
                                <div class="form-group">
                                    <label class="form-label">Organization Name *</label>
                                    <input type="text" class="form-input" x-model="createOrgForm.organization_name"
                                           placeholder="e.g. Jagatsinghpur Sakha Sangha" maxlength="200">
                                </div>

                                <!-- Type + Parent -->
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                                    <div class="form-group">
                                        <label class="form-label">Organization Type *</label>
                                        <select class="nss-select" x-model="createOrgForm.organization_type_code"
                                                @change="onCreateOrgTypeChange()">
                                            <option value="">— Select Type —</option>
                                            <template x-for="t in creatableOrgTypes" :key="t.master_data_pk">
                                                <option :value="t.value_code" x-text="t.value_name"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Parent Organization</label>

                                        <!-- ORG-BR-100: single-instance types are auto-parented to the
                                             sole Kendra — locked, not chosen. -->
                                        <template x-if="isParentAutoResolved">
                                            <div>
                                                <input type="text" class="form-input" disabled
                                                       :value="kendraOrg ? (kendraOrg.organization_name + ' (KENDRA)') : 'No active Kendra found'">
                                                <p class="form-hint">Auto-resolved — this type always reports to the Kendra.</p>
                                            </div>
                                        </template>

                                        <!-- ORG-BR-101/102: Kumari/Sevak parent Sakha, scoped to the caller. -->
                                        <template x-if="!isParentAutoResolved && isKumariSevakType">
                                            <div>
                                                <select class="nss-select" x-model="createOrgForm.parent_organization_pk"
                                                        :disabled="kumariSevakScope.mode === 'locked' || kumariSevakScopeLoading">
                                                    <option value="">— Select Sakha —</option>
                                                    <template x-for="s in kumariSevakScope.sakhas" :key="s.organization_pk">
                                                        <option :value="s.organization_pk" x-text="s.organization_name"></option>
                                                    </template>
                                                </select>
                                                <p class="form-hint" x-show="kumariSevakScopeLoading">Loading eligible Sakhas…</p>
                                                <p class="form-hint" x-show="!kumariSevakScopeLoading && kumariSevakScope.mode === 'locked'">Auto-selected — this is the only Sakha in your scope.</p>
                                                <p class="form-hint" x-show="!kumariSevakScopeLoading && kumariSevakScope.mode === 'choose' && kumariSevakScope.sakhas.length === 0">No eligible Sakha found (each Sakha may only have one).</p>
                                            </div>
                                        </template>

                                        <!-- Default: generic parent dropdown (SAKHA_SANGHA, etc.) -->
                                        <template x-if="!isParentAutoResolved && !isKumariSevakType">
                                            <select class="nss-select" x-model="createOrgForm.parent_organization_pk">
                                                <option value="">— None (Top Level) —</option>
                                                <template x-for="o in parentOrgs" :key="o.organization_pk">
                                                    <option :value="o.organization_pk"
                                                            x-text="o.organization_name + ' (' + (o.organization_type_code || '') + ')'"></option>
                                                </template>
                                            </select>
                                        </template>
                                    </div>
                                </div>

                                <!-- Premises (ORG-BR-098: only meaningful for Sakha Sangha) -->
                                <template x-if="orgTypeHasPremises">
                                    <div class="form-group">
                                        <label class="form-label">Does this Sakha have its own premises? *</label>
                                        <select class="nss-select" x-model="createOrgForm.has_own_premises">
                                            <option :value="true">Yes — has its own premises</option>
                                            <option :value="false">No — meets as a Sakha Asana (no dedicated premises)</option>
                                        </select>
                                        <p class="form-hint">Stored as Sakha Sangha either way (ORG-BR-098); this only records whether it currently has dedicated premises.</p>
                                    </div>
                                </template>

                                <!-- Kumari/Sevak wings: code + all location/contact
                                     detail are inherited from the parent Sakha
                                     (ORG-BR-092/102). No manual entry — the fields
                                     below are hidden for these two types. -->
                                <template x-if="isKumariSevakType">
                                    <div class="form-group">
                                        <div style="padding: 0.75rem 1rem; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 0.5rem; color: #9a3412; font-size: 0.85rem; line-height: 1.5;">
                                            <strong>Part of the parent Sakha.</strong>
                                            This
                                            <span x-text="createOrgForm.organization_type_code === 'KUMARI_SANGHA' ? 'Kumari Sangha' : 'Sevak Sangha'"></span>
                                            has no organization code or short code of its own — it is a
                                            wing of the selected Sakha Sangha, which already holds those.
                                            Its address, location and contact details are taken
                                            automatically from that Sakha. Just choose the parent Sakha
                                            above; there is nothing else to enter here.
                                        </div>
                                    </div>
                                </template>

                                <!-- Code + address + contact: hidden for wings,
                                     which inherit all of it from the parent Sakha. -->
                                <template x-if="!isKumariSevakType">
                                <div>
                                <!-- Codes -->
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                                    <div class="form-group">
                                        <label class="form-label">Organization Code</label>
                                        <!-- ORG-BR-105: the org code is the org-type sequence
                                             value, auto-generated on submit. Shown here as a live,
                                             read-only preview of what the code WILL be — peeked, not
                                             minted, so viewing the form never burns a number. -->
                                        <input type="text" class="form-input" disabled
                                               :value="orgCodePreviewLoading ? 'Generating…' : (orgCodePreview || '—')"
                                               style="text-transform: uppercase; background:#f9fafb; color:#374151;">
                                        <div class="form-hint" x-show="!createOrgForm.organization_type_code" style="color:#6b7280;">Select an organization type to preview its code.</div>
                                        <div class="form-hint" x-show="createOrgForm.organization_type_code && !orgCodePreviewLoading">Auto-generated from the <span x-text="createOrgForm.organization_type_code"></span> sequence. Assigned only on submit — the real code may differ if another org of this type is created first.</div>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Short Code</label>
                                        <input type="text" class="form-input" x-model="createOrgForm.short_code"
                                               placeholder="3-5 chars" maxlength="5"
                                               style="text-transform: uppercase;"
                                               @input.debounce.10ms="onCodeInput('short_code', 'shortCodeCheck', $event.target.value)"
                                               :class="shortCodeCheck.conflict ? 'input-error' : ''">
                                        <div class="form-hint" x-show="shortCodeCheck.checking" style="color:#6b7280;">Checking…</div>
                                        <template x-if="shortCodeCheck.conflict">
                                            <div class="form-hint" style="color:#b91c1c;">
                                                Already used by
                                                <strong x-text="shortCodeCheck.conflict.organization_name"></strong>
                                                <span x-text="'(' + shortCodeCheck.conflict.type_name + ')'"></span>
                                                <span x-show="!shortCodeCheck.conflict.is_active" style="color:#92400e;"> — inactive</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Address Line 1 (ORG-BR-099: premises-only, hidden for Anchalika/Zilla/Patha Chakra) -->
                                <template x-if="!orgTypeProhibitsAddress">
                                <div class="form-group">
                                    <label class="form-label">Address Line 1</label>
                                    <input type="text" class="form-input" x-model="createOrgForm.address_line_1"
                                           placeholder="Street address" maxlength="200">
                                </div>
                                </template>

                                <!-- Jurisdiction: Country + State (ORG-BR-099 narrowed — these map to
                                     administrative jurisdiction, not a physical premises, so they're
                                     available for every type incl. Anchalika/Zilla/Patha Chakra; and
                                     mandatory specifically for those 3, since they have no premises
                                     but must still record which state/district they administer). -->
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                                    <div class="form-group">
                                        <label class="form-label">Country<span x-show="orgTypeProhibitsAddress" style="color:#b91c1c;"> *</span></label>
                                        <select class="nss-select" x-model="createOrgForm.country_pk" @change="onCreateOrgCountryChange()" :required="orgTypeProhibitsAddress">
                                            <option value="">— Select —</option>
                                            <template x-for="c in createOrgCountries" :key="c.country_pk">
                                                <option :value="c.country_pk" x-text="c.country_name"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">State<span x-show="orgTypeProhibitsAddress" style="color:#b91c1c;"> *</span></label>
                                        <select class="nss-select" x-model="createOrgForm.state_pk" @change="onCreateOrgStateChange()" :disabled="!createOrgForm.country_pk" :required="orgTypeProhibitsAddress">
                                            <option value="">— Select —</option>
                                            <template x-for="s in createOrgStates" :key="s.state_pk">
                                                <option :value="s.state_pk" x-text="s.state_name"></option>
                                            </template>
                                        </select>
                                    </div>
                                </div>

                                <!-- District (jurisdiction — always available, mandatory for the same 3 types, see above) -->
                                <div class="form-group">
                                    <label class="form-label">District<span x-show="orgTypeProhibitsAddress" style="color:#b91c1c;"> *</span></label>
                                    <select class="nss-select" x-model="createOrgForm.district_pk" @change="onCreateOrgDistrictChange()" :disabled="!createOrgForm.state_pk" :required="orgTypeProhibitsAddress">
                                        <option value="">— Select —</option>
                                        <template x-for="d in createOrgDistricts" :key="d.district_pk">
                                            <option :value="d.district_pk" x-text="d.district_name"></option>
                                        </template>

                        <!-- Status filter tabs -->

                                    @click="claimsStatusFilter = 'PENDING'; claimsPage = 1; selectedClaim = null; claimEditing = false; loadClaims()">

                                <span class="count-badge" x-show="claimsPendingCount > 0" x-text="claimsPendingCount"></span>
                            </button>
                            <button class="tab-pill" :class="{ active: claimsStatusFilter === 'APPROVED' }"
                                    @click="claimsStatusFilter = 'APPROVED'; claimsPage = 1; selectedClaim = null; claimEditing = false; loadClaims()">
                                Approved
                            </button>
                            <button class="tab-pill" :class="{ active: claimsStatusFilter === 'REJECTED' }"
                                    @click="claimsStatusFilter = 'REJECTED'; claimsPage = 1; selectedClaim = null; claimEditing = false; loadClaims()">
                                Rejected
                            </button>
                        </div>

                        <!-- Claims List -->
                        <div x-show="!selectedClaim">
                            <div class="data-card">
                                <div class="data-card-header">
                                    <h2 class="data-card-title" x-text="claimsStatusFilter + ' Registration Claims'"></h2>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <span style="font-size: 0.75rem; color: #6b7280;" x-text="claimsTotal + ' total'"></span>
                                        <button class="btn-action" @click="loadClaims()">Refresh</button>
                                    </div>
                                </div>
                                <div class="data-card-body">

                                    <!-- Loading -->
                                    <div x-show="claimsLoading" style="display: flex; justify-content: center; padding: 2rem 0;">
                                        <div class="spinner"></div>
                                    </div>

                                    <!-- Empty -->
                                    <template x-if="!claimsLoading && claims.length === 0">
                                        <p style="font-size: 0.85rem; color: #6b7280; padding: 1.5rem 0; text-align: center;">
                                            No <span x-text="claimsStatusFilter.toLowerCase()"></span> claims found.
                                        </p>
                                    </template>

                                    <!-- Table -->
                                    <template x-if="!claimsLoading && claims.length > 0">
                                        <div>
                                            <div style="overflow-x: auto;">
                                                <table class="admin-table">
                                                    <!-- Sorting is server-side: this queue is paginated, so a header
                                                         click re-queries from page 1 instead of reordering only the
                                                         rows that happen to be on screen. -->
                                                    <thead>
                                                        <tr>
                                                            <th class="sortable" @click="sortClaims('person_id')" :aria-sort="NSS.sortAria(claimsSortBy, claimsSortDir, 'person_id')">Person ID<span class="sort-ind" x-text="NSS.sortIcon(claimsSortBy, claimsSortDir, 'person_id')"></span></th>
                                                            <th class="sortable" @click="sortClaims('person_name')" :aria-sort="NSS.sortAria(claimsSortBy, claimsSortDir, 'person_name')">Name<span class="sort-ind" x-text="NSS.sortIcon(claimsSortBy, claimsSortDir, 'person_name')"></span></th>
                                                            <th class="sortable" @click="sortClaims('organization_name')" :aria-sort="NSS.sortAria(claimsSortBy, claimsSortDir, 'organization_name')">Sakha<span class="sort-ind" x-text="NSS.sortIcon(claimsSortBy, claimsSortDir, 'organization_name')"></span></th>
                                                            <th class="sortable" @click="sortClaims('claimed_membership_type')" :aria-sort="NSS.sortAria(claimsSortBy, claimsSortDir, 'claimed_membership_type')">Membership<span class="sort-ind" x-text="NSS.sortIcon(claimsSortBy, claimsSortDir, 'claimed_membership_type')"></span></th>
                                                            <th class="sortable" @click="sortClaims('claimed_local_sakha_number')" :aria-sort="NSS.sortAria(claimsSortBy, claimsSortDir, 'claimed_local_sakha_number')">Local No.<span class="sort-ind" x-text="NSS.sortIcon(claimsSortBy, claimsSortDir, 'claimed_local_sakha_number')"></span></th>
                                                            <th class="sortable" @click="sortClaims('created_at')" :aria-sort="NSS.sortAria(claimsSortBy, claimsSortDir, 'created_at')">Submitted<span class="sort-ind" x-text="NSS.sortIcon(claimsSortBy, claimsSortDir, 'created_at')"></span></th>
                                                            <th></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template x-for="c in claims" :key="c.registration_claim_pk">
                                                            <tr @click="viewClaim(c.registration_claim_pk)">
                                                                <td style="font-family: ui-monospace, monospace; font-size: 0.75rem;" x-text="c.person_id"></td>
                                                                <td x-text="c.person_name"></td>
                                                                <td style="font-size: 0.8rem;" x-text="c.organization_name"></td>
                                                                <td>
                                                                    <!-- claimed_membership_type is a display NAME ("Darshaka"),
                                                                         not a value_code, so NSS.typeBadgeClass() (code-keyed)
                                                                         can't be used here. Darshaka is the display name of
                                                                         PROBATIONARY; anything else is a full membership. -->
                                                                    <span class="badge badge-xs"
                                                                          :class="c.claimed_membership_type === 'Darshaka' ? 'badge-type-probationary' : 'badge-type-regular'"
                                                                          x-text="c.claimed_membership_type"></span>
                                                                </td>
                                                                <td style="font-family: ui-monospace, monospace; font-size: 0.75rem;" x-text="c.claimed_local_sakha_number || '—'"></td>
                                                                <td style="font-size: 0.75rem;" x-text="formatDate(c.created_at)"></td>
                                                                <td>
                                                                    <button class="btn-action" style="font-size: 0.7rem;" @click.stop="viewClaim(c.registration_claim_pk)">View →</button>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>

                                            <!-- Pagination -->
                                            <div class="pagination-bar" x-show="claimsTotal > claimsPageSize">
                                                <span x-text="'Page ' + claimsPage + ' of ' + Math.ceil(claimsTotal / claimsPageSize)"></span>
                                                <div style="display: flex; gap: 0.35rem;">
                                                    <button class="btn-action" :disabled="claimsPage <= 1" @click="claimsPage--; loadClaims()">Prev</button>
                                                    <button class="btn-action" :disabled="claimsPage * claimsPageSize >= claimsTotal" @click="claimsPage++; loadClaims()">Next</button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- Claim Detail -->
                        <div x-show="selectedClaim">
                            <a class="back-link" @click="selectedClaim = null; claimEditing = false; loadClaims(); loadClaimsPendingCount();">&larr; Back to list</a>

                            <div class="data-card">
                                <div class="data-card-header">
                                    <div>
                                        <h2 class="data-card-title" x-text="selectedClaim?.person_name"></h2>
                                        <span style="font-size: 0.75rem; color: #6b7280;">
                                            Person ID: <span style="font-family: monospace;" x-text="selectedClaim?.person_id"></span>
                                        </span>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <template x-if="selectedClaim?.claim_status === 'PENDING' && !claimEditing">
                                            <button class="btn-action primary" @click="startClaimEdit()" style="font-size: 0.75rem;">Edit</button>
                                        </template>
                                        <span class="badge badge-sm"
                                              :class="NSS.claimBadgeClass(selectedClaim?.claim_status)"
