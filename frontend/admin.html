                                                    <div style="font-size:0.82rem; font-weight:600; color:#374151; margin-bottom:0.5rem;">Record a vote for a member (officer)</div>
                                                    <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end;">
                                                        <div style="min-width:16rem;"><label class="form-label">Candidate</label>
                                                            <select class="form-input" x-model="govVoteForm.election_nomination_pk">
                                                                <option value="">Select a candidate…</option>
                                                                <template x-for="n in govVotableNominations()" :key="n.election_nomination_pk">
                                                                    <option :value="n.election_nomination_pk" x-text="n.candidate_name + ' — ' + n.position_name"></option>
                                                                </template>
                                                            </select>
                                                        </div>
                                                        <div style="position:relative; min-width:15rem;">
                                                            <label class="form-label">Voter (member)</label>
                                                            <input type="text" class="form-input" x-model="govVoteForm.voterQuery"
                                                                   @input="onGovMemberSearch(govVoteForm, 'voter', govSelectedElection && govSelectedElection.organization_pk)" placeholder="Search member…" autocomplete="off">
                                                            <div x-show="govVoteForm.voterResults.length > 0" style="position:absolute; z-index:20; background:#fff; border:1px solid #e5e7eb; border-radius:0.4rem; width:100%; max-height:14rem; overflow-y:auto; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
                                                                <template x-for="m in govVoteForm.voterResults" :key="m.sangha_sevi_pk">
                                                                    <div style="padding:0.4rem 0.6rem; cursor:pointer; font-size:0.82rem;" @click="selectGovMember(govVoteForm, 'voter', m)">
                                                                        <span x-text="m.first_name + ' ' + (m.last_name || '')"></span>
                                                                        <span class="mono" style="color:#94a3b8; margin-left:0.4rem;" x-text="m.sangha_sevi_id"></span>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                        <button class="btn-action primary" :disabled="govVoteForm.saving" @click="castOfficerVote()"
                                                                x-text="govVoteForm.saving ? 'Recording…' : 'Record vote'"></button>
                                                    </div>
                                                    <div class="alert-msg alert-error" style="margin:0.5rem 0 0;" x-show="govVoteForm.error" x-text="govVoteForm.error"></div>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- TALLY — ballot cycles only; a nomination
                                             (consensus) cycle casts no votes. -->
                                        <div class="data-card" style="margin-bottom:1rem;" x-show="!govIsNominationOnly()">
                                            <div class="data-card-header">
                                                <h3 class="data-card-title" style="font-size:0.95rem;">Tally</h3>
                                                <button class="btn-action" @click="loadGovTally()">Refresh</button>
                                            </div>
                                            <div class="data-card-body">
                                                <div style="display:flex; justify-content:center; padding:1rem;" x-show="govTallyLoading"><div class="spinner"></div></div>
                                                <div class="alert-msg alert-error" x-show="govTallyError" x-text="govTallyError"></div>
                                                <div class="data-rows" x-show="!govTallyLoading && !govTallyError">
                                                    <div x-show="govTally.length === 0" style="padding:0.8rem; color:#6b7280;">No votes tallied yet.</div>
                                                    <template x-for="t in govTally" :key="t.election_nomination_pk">
                                                        <div class="data-row">
                                                            <span class="data-label">
                                                                <span x-text="t.candidate_name"></span>
                                                                <div class="mono" style="font-size:0.72rem; color:#94a3b8;" x-text="t.position_name"></div>
                                                            </span>
                                                            <span class="data-value" style="font-weight:600;" x-text="t.vote_count + (t.vote_count === 1 ? ' vote' : ' votes')"></span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- RESULTS -->
                                        <div class="data-card" style="margin-bottom:1rem;">
                                            <div class="data-card-header">
                                                <h3 class="data-card-title" style="font-size:0.95rem;">Results</h3>
                                                <button class="btn-action primary" x-show="canManageGovernance"
                                                        @click="govResultForm.show = !govResultForm.show"
                                                        x-text="govResultForm.show ? 'Cancel' : '+ Declare Result'"></button>
                                            </div>
                                            <div class="data-card-body">
                                                <div x-show="govResultForm.show" x-cloak style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:1rem; padding:0.75rem; border:1px solid #e5e7eb; border-radius:0.5rem;">
                                                    <div><label class="form-label">Position</label>
                                                        <select class="form-input" style="max-width:14rem;" x-model="govResultForm.position_master_pk" @change="govResultForm.winning_nomination_pk = ''">
                                                            <option value="">Select…</option>
                                                            <template x-for="p in govElectionPositions" :key="p.position_master_pk">
                                                                <option :value="p.position_master_pk" x-text="p.position_name"></option>
                                                            </template>
                                                        </select>
                                                    </div>
                                                    <div style="min-width:15rem;"><label class="form-label">Winning candidate</label>

                                                            <template x-for="n in govNominationsForPosition(govResultForm.position_master_pk)" :key="n.election_nomination_pk">
                                                                <option :value="n.election_nomination_pk" x-text="n.candidate_name"></option>
                                                            </template>
                                                        </select>
                                                    </div>
                                                    <div><label class="form-label">Status</label>
                                                        <select class="form-input" style="max-width:11rem;" x-model="govResultForm.result_status">

                                                            <template x-for="s in govResultStatusOptions()" :key="s">
                                                                <option :value="s" x-text="s"></option>
                                                            </template>
                                                        </select>
                                                    </div>
                                                    <button class="btn-action primary" :disabled="govResultForm.saving" @click="declareGovResult()"
                                                            x-text="govResultForm.saving ? 'Saving…' : 'Declare'"></button>
                                                    <div class="alert-msg alert-error" style="margin:0; width:100%;" x-show="govResultForm.error" x-text="govResultForm.error"></div>
                                                </div>

                                                <div style="display:flex; justify-content:center; padding:1rem;" x-show="govResultsLoading"><div class="spinner"></div></div>
                                                <div class="data-rows" x-show="!govResultsLoading">
                                                    <div x-show="govResults.length === 0" style="padding:0.8rem; color:#6b7280;">No results declared yet.</div>
                                                    <template x-for="r in govResults" :key="r.election_result_pk">
                                                        <div class="data-row">
                                                            <span class="data-label">
                                                                <span x-text="r.winner_name || '— ' + r.result_status"></span>
                                                                <div class="mono" style="font-size:0.72rem; color:#94a3b8;" x-text="r.position_name + (r.vote_count !== null ? ' · ' + r.vote_count + ' votes' : '')"></div>
                                                            </span>
                                                            <span class="data-value" style="display:flex; align-items:center; gap:0.5rem; justify-content:flex-end; flex-wrap:wrap;">
                                                                <span class="badge badge-xs badge-success" x-text="r.result_status"></span>
                                                                <button class="btn-action primary" style="padding:0.15rem 0.6rem; font-size:0.72rem;"
                                                                        x-show="canManageGovernance && r.winner_person_pk" @click="applyGovResult(r)">Apply → Assignment</button>
                                                            </span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- RESET — ballot cycles only; there are no
                                             ballots to reset in a consensus cycle. -->
                                        <div class="data-card" x-show="canManageGovernance && !govIsNominationOnly()" style="border-color:#f1c9b0;">
                                            <div class="data-card-header">
                                                <h3 class="data-card-title" style="font-size:0.95rem; color:#b45309;">Reset ballots</h3>
                                                <button class="btn-action danger" @click="govResetForm.show = !govResetForm.show"
                                                        x-text="govResetForm.show ? 'Cancel' : 'Reset…'"></button>
                                            </div>
                                            <div class="data-card-body" x-show="govResetForm.show" x-cloak>
                                                <p style="font-size:0.78rem; color:#6b7280; margin:0 0 0.8rem;">Hard-deletes cast ballots (the only way to clear immutable ballots). Audit-logged.</p>
                                                <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end;">
                                                    <div><label class="form-label">Authority</label>
                                                        <select class="form-input" style="max-width:18rem;" x-model="govResetForm.reset_mode">
                                                            <option value="PRESIDENT_UNILATERAL">President (unilateral)</option>
                                                            <option value="ADMIN_WITH_PRESIDENT_APPROVAL">Admin with President approval</option>
                                                        </select>
                                                    </div>
                                                    <div><label class="form-label">Scope</label>
                                                        <select class="form-input" style="max-width:14rem;" x-model="govResetForm.position_master_pk">
                                                            <option value="">Whole election</option>
                                                            <template x-for="p in govElectionPositions" :key="p.position_master_pk">
                                                                <option :value="p.position_master_pk" x-text="p.position_name"></option>
                                                            </template>
                                                        </select>
                                                    </div>
                                                    <div style="position:relative; min-width:15rem;" x-show="govResetForm.reset_mode === 'ADMIN_WITH_PRESIDENT_APPROVAL'">
                                                        <label class="form-label">Approving President</label>
                                                        <input type="text" class="form-input" x-model="govResetForm.presidentQuery"
                                                               @input="onGovMemberSearch(govResetForm, 'president')" placeholder="Search member…" autocomplete="off">
                                                        <div x-show="govResetForm.presidentResults.length > 0" style="position:absolute; z-index:20; background:#fff; border:1px solid #e5e7eb; border-radius:0.4rem; width:100%; max-height:14rem; overflow-y:auto; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
                                                            <template x-for="m in govResetForm.presidentResults" :key="m.sangha_sevi_pk">
                                                                <div style="padding:0.4rem 0.6rem; cursor:pointer; font-size:0.82rem;" @click="selectGovMember(govResetForm, 'president', m)">
                                                                    <span x-text="m.first_name + ' ' + (m.last_name || '')"></span>
                                                                    <span class="mono" style="color:#94a3b8; margin-left:0.4rem;" x-text="m.sangha_sevi_id"></span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                    <div style="flex:1; min-width:14rem;"><label class="form-label">Reason</label>
                                                        <input type="text" class="form-input" x-model="govResetForm.reason" placeholder="Why are the ballots being reset?"></div>
                                                    <button class="btn-action danger" :disabled="govResetForm.saving" @click="resetGovBallots()"
                                                            x-text="govResetForm.saving ? 'Resetting…' : 'Reset ballots'"></button>
                                                </div>
                                                <div class="alert-msg alert-error" style="margin:0.5rem 0 0;" x-show="govResetForm.error" x-text="govResetForm.error"></div>
                                            </div>
                                        </div>

                                    </div>
                                </template>

                            </div>
                        </div>
                    </div>

                    <!-- ═══════════════════════════════════════════
                         VIEW: Correspondence Register (Tier 6, SOL-ADMIN-009)
                         api/routers/correspondence.py — 9 endpoints.
                         List/detail toggle (same shape as the Claims tab)
                         rather than true in-row expand — a correspondence
                         record carries sender/recipient/responsible-party/
                         documents/finance-references, too much to read
                         comfortably inside a table row.
                         ═══════════════════════════════════════════ -->
                    <div x-show="activeTab === 'correspondence'" x-cloak>

                        <!-- ── List ─────────────────────────────── -->
                        <div x-show="!corrSelected && !corrDetailLoading">

                            <div class="tab-pills">
                                <button class="tab-pill" :class="{ active: corrStatusFilter === '' }"
                                        @click="corrStatusFilter = ''; corrApplyFilters()">All</button>
                                <button class="tab-pill" :class="{ active: corrStatusFilter === 'REGISTERED' }"
                                        @click="corrStatusFilter = 'REGISTERED'; corrApplyFilters()">Registered</button>
                                <button class="tab-pill" :class="{ active: corrStatusFilter === 'PENDING_ACTION' }"
                                        @click="corrStatusFilter = 'PENDING_ACTION'; corrApplyFilters()">Pending Action</button>
                                <button class="tab-pill" :class="{ active: corrStatusFilter === 'ACTIONED' }"
                                        @click="corrStatusFilter = 'ACTIONED'; corrApplyFilters()">Actioned</button>
                                <button class="tab-pill" :class="{ active: corrStatusFilter === 'CLOSED' }"
                                        @click="corrStatusFilter = 'CLOSED'; corrApplyFilters()">Closed</button>
                            </div>

                            <div class="data-card">
                                <div class="data-card-header">
                                    <h2 class="data-card-title">Correspondence Register</h2>
                                    <div style="display:flex; gap:0.5rem; align-items:center;">
                                        <span style="font-size: 0.75rem; color: #6b7280;" x-text="corrTotal + ' total'"></span>
                                        <button class="btn-action primary" x-show="canManageCorrespondence" @click="toggleCorrCreateForm()">
                                            <span x-text="corrCreateForm.show ? 'Cancel' : '+ Register Correspondence'"></span>
                                        </button>
                                    </div>
                                </div>
                                <div class="data-card-body">

                                    <!-- Filter row -->
                                    <div style="display:flex; gap:0.75rem; align-items:flex-end; flex-wrap:wrap; margin-bottom:1rem;">
                                        <div style="position:relative; min-width:16rem;">
                                            <label class="form-label">Organization</label>
                                            <input type="text" class="form-input" x-model="corrOrgFilter.query"
                                                   @input="corrOnOrgQueryInput(corrOrgFilter)" placeholder="Search by organization name…" autocomplete="off">
                                            <div x-show="corrOrgFilter.results.length > 0"
                                                 style="position:absolute; z-index:20; background:#fff; border:1px solid #e5e7eb; border-radius:0.4rem; width:100%; max-height:14rem; overflow-y:auto; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
                                                <template x-for="org in corrOrgFilter.results" :key="org.organization_pk">
                                                    <div style="padding:0.4rem 0.6rem; cursor:pointer; font-size:0.82rem;"
                                                         @click="corrSelectOrg(corrOrgFilter, org); corrOrgFilter.pk = org.organization_pk; corrApplyFilters()">
                                                        <span x-text="org.organization_name"></span>
                                                        <span class="mono" style="color:#94a3b8; margin-left:0.4rem;" x-text="org.type_name || org.type_code"></span>
                                                    </div>
                                                </template>
                                            </div>
                                            <p class="form-hint" x-show="corrOrgFilter.pk">
                                                Filtering by this organization's register.
                                                <a @click="corrClearOrgFilter()" style="cursor:pointer; text-decoration:underline;">Clear</a>
                                            </p>
                                        </div>

                    </template>
                    <div style="display: flex; justify-content: center; padding: 1.5rem;" x-show="credTimelineLoading">
                        <div class="spinner"></div>
                    </div>
                    <template x-if="!credTimelineLoading && !credTimelineError">
                        <div>
                            <div x-show="credTimelineEntries.length === 0" style="padding: 1rem; color: #6b7280;">
                                No Anumati or Parichaya Patra has ever been issued to this member.
                            </div>
                            <template x-for="e in credTimelineEntries" :key="e.credential_pk">
                                <div class="data-card" style="margin-bottom: 0.75rem;">
                                    <div class="data-card-body" style="padding: 0.75rem 1rem;">
                                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                            <div>
                                                <div style="font-weight: 600;" x-text="(e.card_type === 'ANUMATI_PATRA' ? 'Anumati Patra' : 'Parichaya Patra')"></div>
                                                <div class="mono" style="font-size: 0.8rem; color: #475569;" x-text="e.document_number"></div>
                                            </div>
                                            <span class="badge badge-xs" :class="NSS.credentialStatusBadgeClass(e.status)" x-text="e.status"></span>
                                        </div>
                                        <div style="font-size: 0.78rem; color: #64748b; margin-top: 0.35rem;">
                                            Issued <span x-text="formatDate(e.issue_date)"></span> ·
                                            Valid <span x-text="formatDate(e.valid_from)"></span> – <span x-text="formatDate(e.valid_to)"></span>

    <!-- ═══════════════════════════════════════════
         MODAL: Create Account (for an existing Sangha Sevi with no login)
         ═══════════════════════════════════════════ -->
    <template x-if="showCreateAccountModal">
        <div class="modal-overlay" @click.self="showCreateAccountModal = false">
            <div class="modal-card">
                <div class="modal-card-header">
                    <h3 x-text="cazSelected ? (cazSelected.has_deleted_account ? 'Restore Access' : 'Create Account') : 'Create Account'"></h3>
                    <p x-show="!cazSelected">Pick a Sangha Sevi who has an SS ID but no login yet.</p>
                    <p x-show="cazSelected">
                        For <strong x-text="cazSelected?.sangha_sevi_id"></strong> — <span x-text="cazSelected?.person_name || '—'"></span>
                    </p>
                </div>
                <div class="modal-card-body">

                    <!-- Step 1: pick the member -->
                    <template x-if="!cazSelected">
                        <div>
                            <div class="search-bar" style="margin-bottom: 0.75rem;">
                                <input type="text" class="form-input" x-model="cazSearch"
                                       @keydown.enter="searchAccountlessMembers()"
                                       placeholder="Search by SS ID or name...">
                                <button class="btn-action primary" @click="searchAccountlessMembers()">Search</button>
                            </div>

                            <template x-if="cazError">
                                <div class="alert-msg alert-error" x-text="cazError"></div>
                            </template>

                            <template x-if="cazLoading">
                                <div style="display: flex; justify-content: center; padding: 1.5rem 0;">
                                    <div class="spinner"></div>
                                </div>
                            </template>

                            <template x-if="!cazLoading && !cazError && cazMembers.length === 0">
                                <div style="font-size: 0.8rem; color: #6b7280; padding: 0.75rem 0;">
                                    No Sangha Sevis without a usable login match this search.
                                </div>
                            </template>

                            <template x-if="!cazLoading && cazMembers.length > 0">
                                <div style="max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem;">
                                    <template x-for="m in cazMembers" :key="m.sangha_sevi_pk">
                                        <button type="button" class="btn-action" style="text-align: left; display: flex; justify-content: space-between; align-items: center; width: 100%;"
                                                @click="cazSelectMember(m)">
                                            <span>
                                                <strong x-text="m.sangha_sevi_id"></strong>
                                                — <span x-text="m.person_name || '—'"></span>
                                                <span style="font-size: 0.7rem; color: #6b7280;" x-text="m.organization_name ? ('· ' + m.organization_name) : ''"></span>
                                            </span>
                                            <span class="badge badge-xs badge-muted" x-show="m.has_deleted_account" style="margin-left: 0.5rem;">Restore</span>
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Step 2: set the password -->
                    <template x-if="cazSelected">
                        <div>
                            <template x-if="cazSelected.has_deleted_account">
                                <div class="alert-msg" style="background: #fffbeb; border: 1px solid #fde68a; color: #92400e; margin-bottom: 0.75rem;">
                                    This person's account was deactivated. Submitting will restore it in place with the password below, not create a second account.
                                </div>
                            </template>

                            <template x-if="cazSubmitError">
                                <div class="alert-msg alert-error" x-text="cazSubmitError"></div>
                            </template>

                            <div class="form-group">
                                <label class="form-label">Initial Password</label>
                                <input type="password" class="form-input" x-model="cazForm.password"
                                       placeholder="Min 8 chars, 1 uppercase, 1 digit"
                                       autocomplete="new-password">
                            </div>
                            <div class="form-group">
                                <label class="form-checkbox-row">
                                    <input type="checkbox" class="nss-checkbox" x-model="cazForm.force_password_change">
                                    Force password change on first login
                                </label>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="modal-card-footer">
                    <button class="btn-action" x-show="!cazSelected" @click="showCreateAccountModal = false">Cancel</button>
                    <button class="btn-action" x-show="cazSelected" @click="cazBackToPicker()">Back</button>
                    <button class="btn-action primary" x-show="cazSelected"
                            @click="submitCreateAccountForMember()"
                            :disabled="cazSubmitLoading || !cazForm.password">
                        <div class="spinner-sm" x-show="cazSubmitLoading"></div>
                        <span x-text="cazSelected?.has_deleted_account ? 'Restore Access' : 'Create Account'"></span>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- ═══════════════════════════════════════════

                <div class="modal-card-body">
                    <template x-if="ssModalError">
                        <div class="alert-msg alert-error" x-text="ssModalError"></div>
                    </template>

                    <div class="form-group" x-show="ssModalMode === 'add'">
                        <label class="form-label">Key</label>
                        <input type="text" class="form-input mono" x-model="ssForm.setting_key"
                               placeholder="e.g. CURRENT_MEMBERSHIP_YEAR">
                        <div style="font-size: 0.72rem; color: #94a3b8; margin-top: 0.25rem;">Stored in upper case. Consumed by code using this exact key.</div>
                    </div>

                    <div class="form-group" x-show="ssModalMode === 'add'">
                        <label class="form-label">Data Type</label>
                        <select class="nss-select" x-model="ssForm.data_type">
                            <option value="STRING">STRING</option>
                            <option value="INTEGER">INTEGER</option>
                            <option value="BOOLEAN">BOOLEAN</option>
                            <option value="DATE">DATE</option>
                            <option value="JSON">JSON</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            Value

                        </label>
                        <input type="text" class="form-input" x-model="ssForm.setting_value"
                               :placeholder="ssForm.data_type === 'BOOLEAN' ? 'true or false' : (ssForm.data_type === 'DATE' ? 'DD/MM/YYYY' : (ssForm.data_type === 'INTEGER' ? 'whole number' : 'value'))">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description <span style="color:#9ca3af; font-weight:400;">(optional)</span></label>
                        <input type="text" class="form-input" x-model="ssForm.description" placeholder="What this setting controls">
                    </div>
                </div>
                <div class="modal-card-footer">
                    <button class="btn-action" @click="closeSettingModal()">Cancel</button>
                    <button class="btn-action primary" @click="saveSetting()"
                            :disabled="ssModalSaving || !ssForm.setting_value || (ssModalMode === 'add' && !ssForm.setting_key)">
                        <div class="spinner-sm" x-show="ssModalSaving"></div>
                        <span x-text="ssModalMode === 'add' ? 'Add' : 'Save'"></span>
                    </button>
                </div>
            </div>
        </div>

                        <input type="text" class="form-input mono" x-model="seqForm.sequence_code"
                               placeholder="e.g. SAKHA">
                        <div style="font-size: 0.72rem; color: #94a3b8; margin-top: 0.25rem;">Stored in upper case. Immutable after creation — consumed by code using this exact code.</div>

                    <div style="font-size: 0.72rem; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 0.5rem 0.65rem;">

                    <button class="btn-action" @click="closeSequenceModal()">Cancel</button>

                        <div class="spinner-sm" x-show="seqModalSaving"></div>
                        <span x-text="seqModalMode === 'add' ? 'Add' : 'Save'"></span>
                    </button>
                </div>
            </div>
        </div>

                            <option value="">Select a role...</option>
                            <template x-for="role in assignableRoles" :key="role.role_code">
                                <option :value="role.role_code" x-text="role.role_code + ' — ' + role.role_name"></option>
                            </template>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Scope Level</label>
                        <!-- Locked to the selected role's own fixed scope_level
                             (role_master.scope_level) — the backend now rejects
                             any other value, so this is no longer a free choice. -->
                        <select class="nss-select" x-model="roleForm.scope_level" disabled>
                            <option value="NSS-WIDE">NSS-WIDE</option>
                            <option value="KENDRA">KENDRA</option>
                            <option value="ANCHALIKA">ANCHALIKA</option>
                            <option value="ZILLA">ZILLA</option>
                            <option value="SAKHA">SAKHA</option>
                            <option value="PATHA_CHAKRA">PATHA_CHAKRA</option>
                            <option value="KENDRA_MAHILA_SANGHA">KENDRA MAHILA SANGHA</option>
                        </select>
                    </div>

                    <div class="form-group" x-show="roleForm.scope_level !== 'NSS-WIDE'">
                        <label class="form-label">Organization</label>
                        <select class="nss-select" x-model="roleForm.organization_pk">
                            <option value="">Select organization...</option>
                            <template x-for="org in scopeFilteredOrgs" :key="org.organization_pk">
                                <option :value="org.organization_pk"
                                        x-text="org.organization_name + ' (' + (org.organization_type_code || '') + ')'"></option>
                            </template>
                        </select>
                    </div>
                </div>
                <div class="modal-card-footer">
                    <button class="btn-action" @click="showRoleModal = false">Cancel</button>
                    <button class="btn-action primary" @click="submitAssignRole()"
                            :disabled="roleLoading || !roleForm.role_code">
                        <div class="spinner-sm" x-show="roleLoading"></div>
                        Assign
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Toast -->
    <div class="toast-notification" x-show="toast" x-transition
         :class="toastType === 'success' ? 'toast-success' : 'toast-error'"
         x-text="toast" x-cloak></div>

    <script src="/assets/js/admin.js"></script>
</body>
</html>
