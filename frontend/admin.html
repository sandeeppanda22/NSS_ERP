                                    </div>
                                </div>
                                <div class="data-card-body">

                                    <!-- READ-ONLY view -->
                                    <template x-if="!claimEditing">
                                        <div>
                                            <div class="detail-grid cols-3">
                                                <div class="detail-item">
                                                    <div class="label">Claimed Sakha</div>
                                                    <div class="value" x-text="selectedClaim?.organization_name"></div>
                                                </div>
                                                <div class="detail-item">
                                                    <div class="label">Membership Type</div>
                                                    <div class="value" x-text="selectedClaim?.claimed_membership_type"></div>
                                                </div>
                                                <div class="detail-item">
                                                    <div class="label">Local Sakha Number</div>
                                                    <div class="value" style="font-family: monospace;" x-text="selectedClaim?.claimed_local_sakha_number || '(not provided)'"></div>
                                                </div>
                                                <div class="detail-item">
                                                    <div class="label" x-text="selectedClaim?.claimed_membership_type === 'Darshaka' ? 'Anumati Patra Number' : 'Parichaya Patra Number'"></div>
                                                    <div class="value" style="font-family: monospace;" x-text="selectedClaim?.claimed_credential_document_number || '(will be auto-generated on approval)'"></div>
                                                </div>
                                            </div>
                                            <div class="detail-grid cols-3">
                                                <div class="detail-item">
                                                    <div class="label">Joining Date</div>
                                                    <div class="value" x-text="selectedClaim?.claimed_joining_date ? NSS.formatDate(selectedClaim.claimed_joining_date) : '(not provided)'"></div>
                                                </div>
                                                <div class="detail-item">
                                                    <div class="label">Mobile</div>
                                                    <div class="value" x-text="formatPhone(selectedClaim?.country_phone_code, selectedClaim?.mobile_number)"></div>
                                                </div>
                                                <div class="detail-item">
                                                    <div class="label">Email</div>
                                                    <div class="value" x-text="selectedClaim?.email || '—'"></div>
                                                </div>
                                            </div>

                                            <!-- Darshak attendance -->
                                            <template x-if="selectedClaim?.darshak_organization_name">
                                                <div class="detail-grid cols-2" style="margin-bottom: 1rem;">
                                                    <div class="detail-item">
                                                        <div class="label">Also attending as Darshak at</div>
                                                        <div class="value" x-text="selectedClaim?.darshak_organization_name"></div>
                                                    </div>
                                                    <div class="detail-item">
                                                        <div class="label">Local Sakha Number (Darshak Sakha)</div>
                                                        <div class="value" style="font-family: monospace;" x-text="selectedClaim?.darshak_local_sakha_number || '(not provided)'"></div>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- Review info (for approved/rejected) -->
                                            <template x-if="selectedClaim?.claim_status !== 'PENDING'">
                                                <div class="alert-msg" :class="selectedClaim?.claim_status === 'APPROVED' ? 'alert-success' : 'alert-error'">
                                                    <strong x-text="selectedClaim?.claim_status"></strong> by
                                                    <span x-text="selectedClaim?.reviewed_by || 'Unknown'"></span>
                                                    on <span x-text="selectedClaim?.reviewed_at ? new Date(selectedClaim.reviewed_at).toLocaleString() : ''"></span>
                                                    <template x-if="selectedClaim?.admin_remarks">
                                                        <div style="margin-top: 0.35rem; font-style: italic;" x-text="selectedClaim?.admin_remarks"></div>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Action buttons (PENDING only) -->
                                            <template x-if="selectedClaim?.claim_status === 'PENDING'">
                                                <div>
                                                    <template x-if="claimActionError">
                                                        <div class="alert-msg alert-error" x-text="claimActionError"></div>
                                                    </template>

                                                    <div class="alert-msg alert-error"
                                                         x-show="sakhaMissingShortCode(selectedClaim?.claimed_organization_pk)">
                                                        This Sakha has no short_code assigned yet. An NSS admin must set it first — approval will fail until then.
                                                    </div>

                                                    <div class="form-group">
                                                        <label class="form-label">
                                                            Admin Remarks
                                                            <span style="font-size: 0.7rem; color: #9ca3af;">(required for rejection)</span>
                                                        </label>
                                                        <textarea class="form-input" rows="2" x-model="adminRemarks"
                                                                  placeholder="Optional for approval, required for rejection..."
                                                                  :disabled="claimActionLoading"
                                                                  style="resize: vertical;"></textarea>
                                                    </div>

                                                    <div style="display: flex; gap: 0.5rem;">
                                                        <button class="btn-action success" style="flex: 1; justify-content: center; padding: 0.5rem;"
                                                                @click="approveClaim()"
                                                                :disabled="claimActionLoading || sakhaMissingShortCode(selectedClaim?.claimed_organization_pk)">
                                                            <div class="spinner-sm" x-show="claimActionLoading"></div>
                                                            Approve &amp; Activate
                                                        </button>
                                                        <button class="btn-action danger" style="flex: 1; justify-content: center; padding: 0.5rem;"
                                                                @click="rejectClaim()" :disabled="claimActionLoading || !adminRemarks.trim()">
                                                            Reject
                                                        </button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- EDIT FORM -->
                                    <div x-show="claimEditing" x-cloak>
                                            <div class="alert-msg alert-info">
                                                Edit registration details before approving. Changes update both the claim and person records.
                                            </div>

                                            <template x-if="claimEditError">
                                                <div class="alert-msg alert-error" x-text="claimEditError"></div>
                                            </template>

                                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                                                <div class="form-group">
                                                    <label class="form-label">First Name</label>
                                                    <input type="text" class="form-input" x-model="claimEditForm.first_name">
                                                </div>
                                                <div class="form-group">
                                                    <label class="form-label">Last Name</label>
                                                    <input type="text" class="form-input" x-model="claimEditForm.last_name">
                                                </div>
                                                <div class="form-group">
                                                    <label class="form-label">Claimed Sakha</label>
                                                    <select class="nss-select" x-model="claimEditForm.claimed_organization_pk">
                                                        <option value="" disabled>Select Sakha...</option>
                                                        <template x-for="s in claimSakhas" :key="s.organization_pk">
                                                            <option :value="s.organization_pk"
                                                                    :selected="s.organization_pk === claimEditForm.claimed_organization_pk"
                                                                    x-text="s.organization_name"></option>
                                                        </template>
                                                    </select>
                                                </div>
                                                <div class="form-group">
                                                    <label class="form-label">Membership Type</label>
                                                    <select class="nss-select" x-model="claimEditForm.claimed_membership_type_master_data_pk">
                                                        <option value="" disabled>Select type...</option>
                                                        <template x-for="mt in membershipTypes" :key="mt.master_data_pk">
                                                            <option :value="mt.master_data_pk"
                                                                    :selected="mt.master_data_pk === claimEditForm.claimed_membership_type_master_data_pk"
                                                                    x-text="mt.value_name"></option>
                                                        </template>
                                                    </select>
                                                </div>
                                                <div class="form-group">
                                                    <label class="form-label">Local Sakha Number</label>
                                                    <input type="text" class="form-input" x-model="claimEditForm.claimed_local_sakha_number" maxlength="20" style="font-family: monospace;">
                                                </div>
                                                <div class="form-group">
                                                    <label class="form-label" x-text="claimEditForm.claimed_membership_type_master_data_pk && credentialLabelFor(claimEditForm.claimed_membership_type_master_data_pk) === 'Anumati Patra' ? 'Anumati Patra Number' : 'Parichaya Patra Number'"></label>
                                                    <input type="text" class="form-input" x-model="claimEditForm.claimed_credential_document_number" maxlength="30" style="font-family: monospace;" placeholder="Leave blank to auto-generate on approval">
                                                </div>
                                                <div class="form-group" x-show="selectedClaim?.darshak_organization_name">
                                                    <label class="form-label">Local Sakha Number (Darshak Sakha)</label>
                                                    <input type="text" class="form-input" x-model="claimEditForm.darshak_local_sakha_number" maxlength="20" style="font-family: monospace;">
                                                </div>
                                                <div class="form-group" x-data="nssDatePicker('claimEditForm.claimed_joining_date')" style="position: relative;">
                                                    <label class="form-label">Joining Date</label>
                                                </div>
                                                <div class="form-group">
                                                    <label class="form-label">Country Code</label>
                                                    <input type="text" class="form-input" x-model="claimEditForm.country_phone_code" maxlength="5" placeholder="+91">
                                                </div>
                                                <div class="form-group">
                                                    <label class="form-label">Mobile Number</label>
                                                    <input type="tel" class="form-input" x-model="claimEditForm.mobile_number" maxlength="15">
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="form-label">Email</label>
                                                <input type="email" class="form-input" x-model="claimEditForm.email">
                                            </div>

                                            <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
                                                <button class="btn-action primary" style="flex: 1; justify-content: center; padding: 0.5rem;"
                                                        @click="saveClaimEdit()" :disabled="claimEditLoading">
                                                    <div class="spinner-sm" x-show="claimEditLoading"></div>
                                                    Save Changes
                                                </button>
                                                <button class="btn-action" style="flex: 1; justify-content: center; padding: 0.5rem;"
                                                        @click="cancelClaimEdit()" :disabled="claimEditLoading">
                                                    Cancel
                                                </button>
                                            </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- ═══════════════════════════════════════════
                         TAB: Sakha Transfer / Darshak change requests
                         (MBR-048/MBR-049)
                         ═══════════════════════════════════════════ -->
                    <div x-show="activeTab === 'changeRequests'" x-cloak>

                        <!-- Status filter tabs -->
                        <div class="tab-pills">
                            <button class="tab-pill" :class="{ active: changeRequestsStatusFilter === 'PENDING_SOURCE_RELEASE' }"
                                    @click="changeRequestsStatusFilter = 'PENDING_SOURCE_RELEASE'; changeRequestsPage = 1; selectedChangeRequest = null; loadChangeRequests()">
                                Pending Release
                                <span class="count-badge" x-show="changeRequestsPendingCount > 0" x-text="changeRequestsPendingCount"></span>
                            </button>
                            <button class="tab-pill" :class="{ active: changeRequestsStatusFilter === 'PENDING_DESTINATION_ACCEPT' }"
                                    @click="changeRequestsStatusFilter = 'PENDING_DESTINATION_ACCEPT'; changeRequestsPage = 1; selectedChangeRequest = null; loadChangeRequests()">
                                Pending Accept
                            </button>
                            <button class="tab-pill" :class="{ active: changeRequestsStatusFilter === 'COMPLETED' }"
                                    @click="changeRequestsStatusFilter = 'COMPLETED'; changeRequestsPage = 1; selectedChangeRequest = null; loadChangeRequests()">
                                Completed
                            </button>
                            <button class="tab-pill" :class="{ active: changeRequestsStatusFilter === 'REJECTED' }"
                                    @click="changeRequestsStatusFilter = 'REJECTED'; changeRequestsPage = 1; selectedChangeRequest = null; loadChangeRequests()">
                                Rejected
                            </button>
                        </div>

                        <!-- List -->
                        <div x-show="!selectedChangeRequest">
                            <div class="data-card">
                                <div class="data-card-header">
                                    <h2 class="data-card-title" x-text="changeRequestsStatusFilterLabel + ' Change Requests'"></h2>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <span style="font-size: 0.75rem; color: #6b7280;" x-text="changeRequestsTotal + ' total'"></span>
                                        <button class="btn-action" @click="loadChangeRequests()">Refresh</button>
                                    </div>
                                </div>
                                <div class="data-card-body">

                                    <div x-show="changeRequestsLoading" style="display: flex; justify-content: center; padding: 2rem 0;">
                                        <div class="spinner"></div>
                                    </div>

                                    <template x-if="!changeRequestsLoading && changeRequests.length === 0">
                                        <p style="font-size: 0.85rem; color: #6b7280; padding: 1.5rem 0; text-align: center;">
                                            No change requests found for this filter.
                                        </p>
                                    </template>

                                    <template x-if="!changeRequestsLoading && changeRequests.length > 0">
                                        <div>
                                            <div style="overflow-x: auto;">
                                                <table class="admin-table">
                                                    <thead>
                                                        <tr>
                                                            <th>Sangha Sevi ID</th>
                                                            <th>Name</th>
                                                            <th>Type</th>
                                                            <th>From Sakha</th>
                                                            <th>To Sakha</th>
                                                            <th>Status</th>
                                                            <th>Requested</th>
                                                            <th></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template x-for="r in changeRequests" :key="r.membership_change_request_pk">
                                                            <tr @click="viewChangeRequest(r.membership_change_request_pk)">
                                                                <td style="font-family: ui-monospace, monospace; font-size: 0.75rem;" x-text="r.sangha_sevi_id"></td>
                                                                <td x-text="r.member_name"></td>
                                                                <td>
                                                                    <span class="badge badge-xs badge-muted" x-text="r.request_type === 'DARSHAK' ? 'Darshak' : 'Transfer'"></span>
                                                                </td>
                                                                <td style="font-size: 0.8rem;" x-text="r.old_organization_name"></td>
                                                                <td style="font-size: 0.8rem;" x-text="r.new_organization_name"></td>
                                                                <td>
                                                                    <span class="badge badge-xs" :class="NSS.changeRequestBadgeClass(r.status)" x-text="NSS.changeRequestStatusLabel(r.status)"></span>
                                                                </td>
                                                                <td style="font-size: 0.75rem;" x-text="formatDate(r.requested_date)"></td>
                                                                <td>
                                                                    <button class="btn-action" style="font-size: 0.7rem;" @click.stop="viewChangeRequest(r.membership_change_request_pk)">View &rarr;</button>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>

                                            <div class="pagination-bar" x-show="changeRequestsTotal > changeRequestsPageSize">
                                                <span x-text="'Page ' + changeRequestsPage + ' of ' + Math.ceil(changeRequestsTotal / changeRequestsPageSize)"></span>
                                                <div style="display: flex; gap: 0.35rem;">
                                                    <button class="btn-action" :disabled="changeRequestsPage <= 1" @click="changeRequestsPage--; loadChangeRequests()">Prev</button>
                                                    <button class="btn-action" :disabled="changeRequestsPage * changeRequestsPageSize >= changeRequestsTotal" @click="changeRequestsPage++; loadChangeRequests()">Next</button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- Detail -->
                        <div x-show="selectedChangeRequest">
                            <a class="back-link" @click="selectedChangeRequest = null; loadChangeRequests(); loadChangeRequestsPendingCount();">&larr; Back to list</a>

                            <div class="data-card">
                                <div class="data-card-header">
                                    <div>
                                        <h2 class="data-card-title" x-text="selectedChangeRequest?.member_name"></h2>
                                        <span style="font-size: 0.75rem; color: #6b7280;">
                                            Sangha Sevi ID: <span style="font-family: monospace;" x-text="selectedChangeRequest?.sangha_sevi_id"></span>
                                        </span>
                                    </div>
                                    <span class="badge badge-sm"
                                          :class="NSS.changeRequestBadgeClass(selectedChangeRequest?.status)"
                                          x-text="NSS.changeRequestStatusLabel(selectedChangeRequest?.status)"></span>
                                </div>
                                <div class="data-card-body">
                                    <div class="detail-grid cols-3">
                                        <div class="detail-item">
                                            <div class="label">Request Type</div>
                                            <div class="value" x-text="selectedChangeRequest?.request_type === 'DARSHAK' ? 'Apply for Darshak' : 'Sakha Transfer'"></div>
                                        </div>
                                        <div class="detail-item">
                                            <div class="label">From Sakha</div>
                                            <div class="value" x-text="selectedChangeRequest?.old_organization_name"></div>
                                        </div>
                                        <div class="detail-item">
                                            <div class="label">To Sakha</div>
                                            <div class="value" x-text="selectedChangeRequest?.new_organization_name"></div>
                                        </div>
                                        <div class="detail-item">
                                            <div class="label">Requested</div>
                                            <div class="value" x-text="formatDate(selectedChangeRequest?.requested_date)"></div>
                                        </div>
                                        <div class="detail-item">
                                            <div class="label">Reason</div>
                                            <div class="value" x-text="selectedChangeRequest?.transfer_reason || '(not provided)'"></div>
                                        </div>
                                        <div class="detail-item" x-show="selectedChangeRequest?.effective_date">
                                            <div class="label">Effective Date</div>
                                            <div class="value" x-text="formatDate(selectedChangeRequest?.effective_date)"></div>
                                        </div>
                                    </div>

                                    <!-- Source decision info -->
                                    <template x-if="selectedChangeRequest?.source_decided_at">
                                        <div class="alert-msg" :class="selectedChangeRequest?.status === 'REJECTED_BY_SOURCE' ? 'alert-error' : 'alert-success'">
                                            Source Sakha <strong x-text="selectedChangeRequest?.status === 'REJECTED_BY_SOURCE' ? 'rejected' : 'released'"></strong>
                                            on <span x-text="new Date(selectedChangeRequest.source_decided_at).toLocaleString()"></span>
                                            <template x-if="selectedChangeRequest?.source_remarks">
                                                <div style="margin-top: 0.35rem; font-style: italic;" x-text="selectedChangeRequest?.source_remarks"></div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Destination decision info -->
                                    <template x-if="selectedChangeRequest?.destination_decided_at">
                                        <div class="alert-msg" :class="selectedChangeRequest?.status === 'REJECTED_BY_DESTINATION' ? 'alert-error' : 'alert-success'">
                                            Destination Sakha <strong x-text="selectedChangeRequest?.status === 'REJECTED_BY_DESTINATION' ? 'rejected' : 'accepted'"></strong>
                                            on <span x-text="new Date(selectedChangeRequest.destination_decided_at).toLocaleString()"></span>
                                            <template x-if="selectedChangeRequest?.destination_remarks">
                                                <div style="margin-top: 0.35rem; font-style: italic;" x-text="selectedChangeRequest?.destination_remarks"></div>
                                            </template>
                                            <template x-if="selectedChangeRequest?.new_local_number">
                                                <div style="margin-top: 0.35rem;">New Local Sakha Number: <span style="font-family: monospace;" x-text="selectedChangeRequest?.new_local_number"></span></div>
                                            </template>
                                        </div>
                                    </template>

                                    <template x-if="changeRequestActionError">
                                        <div class="alert-msg alert-error" x-text="changeRequestActionError"></div>
                                    </template>

                                    <!-- Source-decision action (PENDING_SOURCE_RELEASE only) -->
                                    <template x-if="selectedChangeRequest?.status === 'PENDING_SOURCE_RELEASE'">
                                        <div>
                                            <div class="form-group">
                                                <label class="form-label">
                                                    Remarks
                                                    <span style="font-size: 0.7rem; color: #9ca3af;">(required to reject)</span>
                                                </label>
                                                <textarea class="form-input" rows="2" x-model="changeRequestActionRemarks"
                                                          placeholder="Optional to release, required to reject..."
                                                          :disabled="changeRequestActionLoading"
                                                          style="resize: vertical;"></textarea>
                                            </div>
                                            <div style="display: flex; gap: 0.5rem;">
                                                <button class="btn-action success" style="flex: 1; justify-content: center; padding: 0.5rem;"
                                                        @click="releaseChangeRequest()" :disabled="changeRequestActionLoading">
                                                    <div class="spinner-sm" x-show="changeRequestActionLoading"></div>
                                                    Release to Destination
                                                </button>
                                                <button class="btn-action danger" style="flex: 1; justify-content: center; padding: 0.5rem;"
                                                        @click="rejectSourceChangeRequest()" :disabled="changeRequestActionLoading || !changeRequestActionRemarks.trim()">
                                                    Reject
                                                </button>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Destination-decision action (PENDING_DESTINATION_ACCEPT only) -->
                                    <template x-if="selectedChangeRequest?.status === 'PENDING_DESTINATION_ACCEPT'">
                                        <div>
                                            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                                                <input type="checkbox" id="crIsLegacyImport" x-model="changeRequestIsLegacyImport" :disabled="changeRequestActionLoading">
                                                <label for="crIsLegacyImport" class="form-label" style="margin: 0;">This is a legacy-import record (manually assign the Local Sakha Number)</label>
                                            </div>
                                            <div class="form-group" x-show="changeRequestIsLegacyImport">
                                                <label class="form-label">Local Sakha Number</label>
                                                <input type="text" class="form-input" x-model="changeRequestNewLocalNumber" maxlength="20" style="font-family: monospace;" placeholder="Legacy number as previously recorded">
                                            </div>
                                            <div class="form-group">
                                                <label class="form-label">
                                                    Remarks
                                                    <span style="font-size: 0.7rem; color: #9ca3af;">(required to reject)</span>
                                                </label>
                                                <textarea class="form-input" rows="2" x-model="changeRequestActionRemarks"
                                                          placeholder="Optional to accept, required to reject..."
                                                          :disabled="changeRequestActionLoading"
                                                          style="resize: vertical;"></textarea>
                                            </div>
                                            <div style="display: flex; gap: 0.5rem;">
                                                <button class="btn-action success" style="flex: 1; justify-content: center; padding: 0.5rem;"
                                                        @click="acceptChangeRequest()"

                                                     style="position:absolute; z-index:20; background:#fff; border:1px solid #e5e7eb; border-radius:0.4rem; width:100%; max-height:14rem; overflow-y:auto; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
                                                    <template x-for="org in govBodyForm.orgResults" :key="org.organization_pk">
                                                        <div style="padding:0.4rem 0.6rem; cursor:pointer; font-size:0.82rem;" @click="selectGovBodyOrg(org)">
                                                            <span x-text="org.organization_name"></span>
                                                            <span class="mono" style="color:#94a3b8; margin-left:0.4rem;" x-text="org.type_name || org.type_code"></span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                    <div>
                                        <label class="form-label">Effective From</label>
                                        <input type="date" class="form-input" style="max-width:11rem;" x-model="govBodyForm.effective_from">
                                    </div>
                                    <div style="flex:1; min-width:12rem;">
                                        <label class="form-label">Description</label>
                                        <input type="text" class="form-input" x-model="govBodyForm.description">
                                    </div>
                                    <button class="btn-action primary" :disabled="govBodyForm.saving" @click="createGovBody()"
                                            x-text="govBodyForm.saving ? 'Saving…' : 'Save'"></button>
                                    <div class="alert-msg alert-error" style="margin:0;" x-show="govBodyForm.error" x-text="govBodyForm.error"></div>
                                </div>

                                <div style="display: flex; align-items: center; justify-content: center; padding: 2rem;" x-show="govBodiesLoading">
                                    <div class="spinner"></div>
                                </div>
                                <div class="alert-msg alert-error" x-show="govBodiesError" x-text="govBodiesError"></div>

                                <template x-if="!govBodiesLoading && !govBodiesError">
                                    <div class="data-rows">
                                        <div x-show="govBodies.length === 0" style="padding: 1rem; color: #6b7280;">No Governance Bodies found.</div>
                                        <template x-for="b in govBodies" :key="b.body_master_pk">
                                            <div class="data-row">
                                                <template x-if="govBodyEdit.pk === b.body_master_pk">
                                                    <span class="data-value" style="display:flex; gap:0.5rem; flex:1; align-items:center; flex-wrap:wrap;">
                                                        <input type="text" class="form-input" x-model="govBodyEdit.body_name" style="max-width:14rem;">
                                                        <select class="form-input" style="max-width:10rem;" x-model="govBodyEdit.body_status">
                                                            <option value="ACTIVE">ACTIVE</option>
                                                            <option value="RECONSTITUTED">RECONSTITUTED</option>
                                                            <option value="HISTORICAL">HISTORICAL</option>
                                                            <option value="INACTIVE">INACTIVE</option>
                                                        </select>
                                                        <input type="date" class="form-input" style="max-width:11rem;" x-model="govBodyEdit.effective_to" placeholder="Effective to">
                                                        <button class="btn-action primary" style="padding:0.15rem 0.6rem; font-size:0.72rem;" :disabled="govBodyEdit.saving" @click="saveGovBody()">Save</button>
                                                        <button class="btn-action" style="padding:0.15rem 0.6rem; font-size:0.72rem;" @click="govBodyEdit.pk = null">Cancel</button>
                                                        <span class="alert-msg alert-error" style="margin:0;" x-show="govBodyEdit.error" x-text="govBodyEdit.error"></span>
                                                    </span>
                                                </template>
                                                <template x-if="govBodyEdit.pk !== b.body_master_pk">
                                                    <span class="data-label">
                                                        <span x-text="b.body_name"></span>
                                                        <span class="badge badge-xs" :class="b.body_status === 'ACTIVE' ? 'badge-success' : 'badge-muted'" x-text="b.body_status" style="margin-left:0.4rem;"></span>
                                                        <div class="mono" style="font-size: 0.72rem; color: #94a3b8;" x-text="b.body_code + ' · ' + (b.body_type_name || '')"></div>
                                                        <div style="color:#94a3b8; font-size: 0.75rem;" x-show="b.organization_name" x-text="b.organization_name"></div>
                                                    </span>
                                                </template>
                                                <span class="data-value" style="text-align:right;" x-show="govBodyEdit.pk !== b.body_master_pk">
                                                    <button class="btn-action" style="padding: 0.15rem 0.6rem; font-size: 0.72rem;" x-show="canManageGovernance" @click="startEditGovBody(b)">Edit</button>
                                                </span>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- ═══════════════════════════════════════════
                         VIEW: Governance — Assignments
                         ═══════════════════════════════════════════ -->
                    <div x-show="activeTab === 'govAssignments'" x-cloak>
                        <div class="data-card">
                            <div class="data-card-header">
                                <h2 class="data-card-title">Assignments</h2>
                                <div style="display:flex; gap:0.5rem; align-items:center;">
                                    <select class="form-input" style="max-width:16rem;" x-model="govSelectedBodyPk" @change="onGovBodyChange()">
                                        <option value="">Select a Governance Body…</option>
                                        <template x-for="b in govAssignableBodies" :key="b.body_master_pk">
                                            <option :value="b.body_master_pk" x-text="b.body_name + (b.isNominationBody ? ' (Nominate)' : '')"></option>
                                        </template>
                                    </select>
                                    <button class="btn-action primary" x-show="canManageGovernance && govSelectedBodyPk"
                                            @click="govAssignForm.show = !govAssignForm.show">
                                        <span x-text="govAssignForm.show ? 'Cancel' : ((govAssignableBodies.find(b => b.body_master_pk === govSelectedBodyPk) || {}).isNominationBody ? '+ Nominate' : '+ Add Assignment')"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="data-card-body">
                                <!-- NSS-wide-admin-only: Sakhas with no current Advisory Board
                                     representative (GET /governance/advisory-board/missing-nominations).
                                     Body-independent — shown regardless of govSelectedBodyPk. -->
                                <div x-show="isGovNssWideAdmin" x-cloak
                                     style="margin-bottom:1rem; padding:0.7rem 0.9rem; background:#fff7ed; border:1px solid #fed7aa; border-radius:0.55rem;">
                                    <div style="font-size:0.72rem; letter-spacing:0.02em; text-transform:uppercase; color:#9a3412; font-weight:600; margin-bottom:0.35rem;">
                                        Sakhas not yet represented on the Advisory Board
                                    </div>
                                    <div x-show="govMissingNominationsLoading" style="color:#9ca3af; font-size:0.8rem;">Loading…</div>
                                    <div class="alert-msg alert-error" style="margin:0;" x-show="govMissingNominationsError" x-text="govMissingNominationsError"></div>
                                    <div x-show="!govMissingNominationsLoading && !govMissingNominationsError && govMissingNominations.length === 0" style="color:#166534; font-size:0.8rem;">
                                        Every active Sakha Sangha has nominated a representative.
                                    </div>
                                    <div x-show="!govMissingNominationsLoading && govMissingNominations.length > 0" style="display:flex; flex-wrap:wrap; gap:0.4rem;">
                                        <template x-for="s in govMissingNominations" :key="s.organization_pk">
                                            <span class="badge badge-xs" style="background:#fed7aa; color:#9a3412;"
                                                  :title="s.organization_code"
                                                  x-text="s.organization_name"></span>
                                        </template>
                                    </div>
                                </div>

                                <div x-show="!govSelectedBodyPk" style="padding: 1rem; color: #6b7280;">Select a Governance Body to view its assignments.</div>

                                <!-- Seat-fill summary strip — hidden for a Sakha-scoped admin's
                                     nominate flow (isNominationBody): per-Sakha nomination
                                     occupancy is a single yes/no, not a seat count worth showing. -->
                                <div x-show="govSelectedBodyPk && !govAssignmentsLoading && !govAssignmentsError && !((govAssignableBodies.find(b => b.body_master_pk === govSelectedBodyPk) || {}).isNominationBody)" x-cloak
                                     style="display:flex; align-items:center; gap:0.9rem; margin-bottom:1rem; padding:0.7rem 0.9rem; background:#faf7f3; border:1px solid #efe6da; border-radius:0.55rem;">
                                    <div style="flex:1; min-width:0;">
                                        <div style="font-size:0.72rem; letter-spacing:0.02em; text-transform:uppercase; color:#9a7b55; font-weight:600;">Seats filled</div>
                                        <div style="font-size:0.9rem; color:#1f2937; font-weight:600;">
                                            <span x-text="govSeatsFilled"></span><span x-show="govSeatLimit !== null"> of <span x-text="govSeatLimit"></span></span>
                                            <span style="color:#9ca3af; font-weight:400;" x-show="govSeatLimit === null"> (no fixed limit)</span>
                                        </div>
                                    </div>
                                    <div x-show="govSeatLimit !== null" style="flex:2; min-width:8rem; height:0.45rem; background:#eadfce; border-radius:999px; overflow:hidden;">
                                        <div :style="`width:${govSeatLimit ? Math.min(100, Math.round(govSeatsFilled/govSeatLimit*100)) : 0}%; height:100%; background:#DC7831; border-radius:999px;`"></div>
                                    </div>
                                    <span class="badge badge-xs" x-show="govSeatLimit !== null && govSeatsFilled >= govSeatLimit"
                                          :class="'badge-muted'" x-text="'Full'"></span>
                                </div>

                                <!-- Assign-from-election-result: declared results (DECLARED/
                                     UNCONTESTED with a winner) for this body, restricted to the
                                     positions this admin's dropdown offers. Posts to the same
                                     POST /results/{pk}/apply the Elections tab uses; also handles
                                     replacing an already-filled seat (e.g. updating the Advisory
                                     Board's President/Secretary) by ending the prior holder first. -->
                                <div x-show="canManageGovernance && govSelectedBodyPk && govAssignFromResults.length > 0" x-cloak
                                     style="display:flex; flex-direction:column; gap:0.4rem; margin-bottom:1rem; padding:0.7rem 0.9rem; background:#f0f9ff; border:1px solid #bae6fd; border-radius:0.55rem;">
                                    <div style="font-size:0.72rem; letter-spacing:0.02em; text-transform:uppercase; color:#075985; font-weight:600;">
                                        Assign from a declared election result
                                    </div>
                                    <template x-for="r in govAssignFromResults" :key="r.election_result_pk">
                                        <div style="display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;">
                                            <span style="font-size:0.85rem; color:#0c4a6e;">
                                                <strong x-text="r.winner_name"></strong> — <span x-text="r.position_name"></span>
                                                <span class="badge badge-xs" style="margin-left:0.3rem;" x-text="r.result_status"></span>
                                            </span>
                                            <button class="btn-action primary" style="padding:0.15rem 0.6rem; font-size:0.72rem;"
                                                    @click="assignGovResultWinner(r)">Assign</button>
                                        </div>
                                    </template>
                                </div>

                                <div x-show="govAssignForm.show" x-cloak style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:1rem; padding:0.85rem; border:1px solid #e5e7eb; border-radius:0.5rem; position:relative;">
                                    <div>
                                        <label class="form-label">Position</label>
                                        <select class="form-input" style="max-width:14rem;" x-model="govAssignForm.position_master_pk">
                                            <option value="">Select…</option>
                                            <template x-for="p in govAllowedPositions" :key="p.position_master_pk">
                                                <option :value="p.position_master_pk" x-text="p.position_name"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div style="position:relative; min-width:16rem;">
                                        <label class="form-label">Member</label>
                                        <input type="text" class="form-input" x-model="govAssignForm.personQuery"
                                               @input="onGovPersonQueryInput()" placeholder="Search by name or Sangha Sevi ID…" autocomplete="off">
                                        <div x-show="govAssignForm.personResults.length > 0"
                                             style="position:absolute; z-index:20; background:#fff; border:1px solid #e5e7eb; border-radius:0.4rem; width:100%; max-height:14rem; overflow-y:auto; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
                                            <template x-for="m in govAssignForm.personResults" :key="m.sangha_sevi_pk">
                                                <div style="padding:0.4rem 0.6rem; cursor:pointer; font-size:0.82rem;" @click="selectGovPerson(m)">
                                                    <span x-text="m.first_name + ' ' + (m.last_name || '')"></span>
                                                    <span class="mono" style="color:#94a3b8; margin-left:0.4rem;" x-text="m.sangha_sevi_id"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="form-label">Effective From</label>
                                        <input type="date" class="form-input" style="max-width:11rem;" x-model="govAssignForm.effective_from">
                                    </div>
                                    <button class="btn-action primary" :disabled="govAssignForm.saving" @click="createGovAssignment()"
                                            x-text="govAssignForm.saving ? 'Saving…' : 'Save'"></button>
                                    <div class="alert-msg alert-error" style="margin:0; width:100%;" x-show="govAssignForm.error" x-text="govAssignForm.error"></div>
                                </div>

                                <div style="display: flex; align-items: center; justify-content: center; padding: 2rem;" x-show="govAssignmentsLoading">
                                    <div class="spinner"></div>
                                </div>
                                <div class="alert-msg alert-error" x-show="govAssignmentsError" x-text="govAssignmentsError"></div>

                                <template x-if="govSelectedBodyPk && !govAssignmentsLoading && !govAssignmentsError">
                                    <div class="data-rows">
                                        <div x-show="govAssignments.length === 0 && govInheritedPositions.length === 0" style="padding: 1rem; color: #6b7280;">No assignments recorded for this body.</div>

                                        <!-- Inherited (read-only) office-holders, e.g. the Parichalak
                                             surfaced from the Kendra Governing Body. -->
                                        <template x-for="ih in govInheritedPositions" :key="ih.position_code">
                                            <div class="data-row" style="background:#f8fafc;">
                                                <span class="data-label">
                                                    <span x-text="ih.person_name || '— vacant'" :style="ih.person_name ? '' : 'color:#9ca3af; font-style:italic;'"></span>
                                                    <div class="mono" style="font-size: 0.72rem; color: #94a3b8;" x-text="ih.position_name"></div>
                                                </span>
                                                <span class="data-value" style="display:flex; align-items:center; gap:0.5rem; justify-content:flex-end;">
                                                    <span class="badge badge-xs badge-muted" x-text="'Inherited'"></span>
                                                    <span style="color:#94a3b8; font-size:0.72rem;" x-show="ih.source_body_name" x-text="'from ' + ih.source_body_name"></span>
                                                </span>
                                            </div>
                                        </template>

                                        <template x-for="a in govAssignments" :key="a.body_member_assignment_pk">
                                            <div class="data-row">
                                                <span class="data-label">
                                                    <span x-text="a.person_name"></span>
                                                    <div class="mono" style="font-size: 0.72rem; color: #94a3b8;" x-text="a.position_name"></div>
                                                </span>
                                                <span class="data-value" style="display:flex; align-items:center; gap:0.5rem; justify-content:flex-end; flex-wrap:wrap;">
                                                    <span style="color:#94a3b8; font-size:0.78rem;" x-text="a.effective_from + (a.effective_to ? ' – ' + a.effective_to : ' – present')"></span>
                                                    <span class="badge badge-xs" :class="a.is_active ? 'badge-success' : 'badge-muted'" x-text="a.assignment_status"></span>
                                                    <button class="btn-action danger" style="padding: 0.15rem 0.6rem; font-size: 0.72rem;"
                                                            x-show="canManageGovernance && a.is_active" @click="endGovAssignment(a)">End</button>
                                                </span>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- ═══════════════════════════════════════════
                         VIEW: Governance Elections (Tier 6 voting slice)
                         — list/create elections, nominations, dual-mode
                         (secret/open) voting incl. member self-service,
                         tally, declare+apply results, and ballot reset.
                         GOV-BR-045 (resolved 2026-10-09).
                         ═══════════════════════════════════════════ -->
                    <div x-show="activeTab === 'govElections'" x-cloak>
                        <div class="data-card">
                            <div class="data-card-header">
                                <h2 class="data-card-title">Elections</h2>
                                <button class="btn-action primary" x-show="canManageGovernance"
                                        @click="govElectionForm.show = !govElectionForm.show">
                                    <span x-text="govElectionForm.show ? 'Cancel' : '+ New Election'"></span>
                                </button>
                            </div>
                            <div class="data-card-body">

                                <!-- New-election inline form -->
                                <div x-show="govElectionForm.show" x-cloak style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:1rem; padding:0.85rem; border:1px solid #e5e7eb; border-radius:0.5rem;">
                                    <div style="min-width:16rem;">
                                        <label class="form-label">Governance Body</label>
                                        <select class="form-input" x-model="govElectionForm.body_master_pk">
                                            <option value="">Select a Governance Body…</option>
                                            <template x-for="b in govBodiesAll" :key="b.body_master_pk">
                                                <option :value="b.body_master_pk" x-text="b.body_name"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div style="min-width:13rem;">
                                        <label class="form-label">How posts are filled</label>
                                        <select class="form-input" x-model="govElectionForm.election_type">
                                            <option value="ELECTION">Election — ballot is held</option>
                                            <option value="NOMINATION">Nomination — consensus, no ballot</option>
                                        </select>
                                    </div>
                                    <div><label class="form-label">Election Code</label>
                                        <input type="text" class="form-input" style="max-width:11rem;" x-model="govElectionForm.election_code" placeholder="e.g. SKH1-2026"></div>
                                    <div style="min-width:14rem;"><label class="form-label">Election Name</label>
                                        <input type="text" class="form-input" x-model="govElectionForm.election_name"></div>
                                    <div><label class="form-label">Election Date</label>
                                        <input type="date" class="form-input" style="max-width:11rem;" x-model="govElectionForm.election_date"></div>
                                    <div><label class="form-label">Nomination From</label>
                                        <input type="date" class="form-input" style="max-width:11rem;" x-model="govElectionForm.nomination_start_date"></div>
                                    <div><label class="form-label">Nomination To</label>
                                        <input type="date" class="form-input" style="max-width:11rem;" x-model="govElectionForm.nomination_end_date"></div>
                                    <!-- Voting window + secret ballot apply to a contested
                                         election only; a Nomination (consensus) cycle casts
                                         no ballots at all (GOV-BR-042). -->
                                    <template x-if="govElectionForm.election_type !== 'NOMINATION'">
                                        <div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end;">
                                            <div><label class="form-label">Voting From</label>
                                                <input type="date" class="form-input" style="max-width:11rem;" x-model="govElectionForm.voting_start_date"></div>
                                            <div><label class="form-label">Voting To</label>
                                                <input type="date" class="form-input" style="max-width:11rem;" x-model="govElectionForm.voting_end_date"></div>
                                            <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.82rem; color:#374151; padding-bottom:0.4rem;">
                                                <input type="checkbox" x-model="govElectionForm.is_secret_ballot">
                                                Secret ballot
                                                <span style="color:#94a3b8;" title="Secret: a ballot can never be traced to a member. Open: votes are attributable.">(?)</span>
                                            </label>
                                        </div>
                                    </template>
                                    <div x-show="govElectionForm.election_type === 'NOMINATION'" style="flex-basis:100%; font-size:0.8rem; color:#6b7280; padding-bottom:0.2rem;">
                                        Consensus/selection cycle — no voting window and no ballot.
                                        Posts go straight from accepted nominations to an
                                        Uncontested result (GOV-BR-042).
                                    </div>
                                    <div style="flex-basis:100%; min-width:0;"><label class="form-label">Description</label>
                                        <input type="text" class="form-input" x-model="govElectionForm.description"></div>
                                    <button class="btn-action primary" :disabled="govElectionForm.saving" @click="createGovElection()"
                                            x-text="govElectionForm.saving ? 'Saving…' : 'Create Election'"></button>
                                    <div class="alert-msg alert-error" style="margin:0; width:100%;" x-show="govElectionForm.error" x-text="govElectionForm.error"></div>
                                </div>

                                <!-- Elections list -->
                                <div style="display:flex; align-items:center; justify-content:center; padding:2rem;" x-show="govElectionsLoading"><div class="spinner"></div></div>
                                <div class="alert-msg alert-error" x-show="govElectionsError" x-text="govElectionsError"></div>

                                <template x-if="!govElectionsLoading && !govElectionsError && !govSelectedElectionPk">
                                    <div class="data-rows">
                                        <div x-show="govElections.length === 0" style="padding:1rem; color:#6b7280;">No elections recorded yet.</div>
                                        <template x-for="e in govElections" :key="e.election_pk">
                                            <div class="data-row" style="cursor:pointer;" @click="openGovElection(e)">
                                                <span class="data-label">
                                                    <span x-text="e.election_name"></span>
                                                    <div class="mono" style="font-size:0.72rem; color:#94a3b8;" x-text="e.election_code + ' · ' + (e.body_name || '')"></div>
                                                </span>
                                                <span class="data-value" style="display:flex; align-items:center; gap:0.5rem; justify-content:flex-end; flex-wrap:wrap;">
                                                    <span style="color:#94a3b8; font-size:0.78rem;" x-text="govFmtDate(e.election_date)"></span>
                                                    <span class="badge badge-xs" :class="e.election_type === 'NOMINATION' ? 'badge-warning' : 'badge-success'" x-text="e.election_type === 'NOMINATION' ? 'Nomination' : 'Election'"></span>
                                                    <span class="badge badge-xs" x-show="e.election_type !== 'NOMINATION'" :class="e.is_secret_ballot ? 'badge-info' : 'badge-muted'" x-text="e.is_secret_ballot ? 'Secret' : 'Open'"></span>
                                                    <span class="badge badge-xs" :class="govElectionStatusBadge(e.election_status)" x-text="e.election_status"></span>
                                                </span>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- ── Election detail / management ── -->
                                <template x-if="govSelectedElectionPk && govSelectedElection">
                                    <div>
                                        <!-- back + header + status controls -->
                                        <div style="display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem;">
                                            <button class="btn-action" @click="closeGovElection()">← All elections</button>
                                            <strong x-text="govSelectedElection.election_name"></strong>
                                            <span class="badge badge-xs" :class="govIsNominationOnly() ? 'badge-warning' : 'badge-success'" x-text="govElectionTypeLabel(govSelectedElection.election_type)"></span>
                                            <span class="badge badge-xs" x-show="!govIsNominationOnly()" :class="govSelectedElection.is_secret_ballot ? 'badge-info' : 'badge-muted'" x-text="govSelectedElection.is_secret_ballot ? 'Secret ballot' : 'Open ballot'"></span>
                                            <span class="badge badge-xs" :class="govElectionStatusBadge(govSelectedElection.election_status)" x-text="govSelectedElection.election_status"></span>
                                        </div>

                                        <div x-show="govIsNominationOnly()" class="alert-msg" style="margin-bottom:1rem; background:#fffbeb; border-color:#fcd34d; color:#92400e;">
                                            Consensus/selection cycle — no ballot is held. Record the
                                            nominations, mark the agreed candidate Accepted, then declare
                                            the post Uncontested. Voting is skipped entirely (GOV-BR-042).

                                        <!-- NOMINATIONS -->

                                            </div>
                                            <div class="data-card-body">
                                                <div x-show="govNominationForm.show" x-cloak style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:1rem; padding:0.75rem; border:1px solid #e5e7eb; border-radius:0.5rem;">
                                                    <div><label class="form-label">Position</label>
                                                        <select class="form-input" style="max-width:14rem;" x-model="govNominationForm.position_master_pk">

                                                            <template x-for="p in govElectionPositions" :key="p.position_master_pk">
                                                                <option :value="p.position_master_pk" x-text="p.position_name"></option>
                                                            </template>
                                                        </select>
                                                    </div>

                                                            <template x-for="m in govNominationForm.candidateResults" :key="m.sangha_sevi_pk">
                                                                <div style="padding:0.4rem 0.6rem; cursor:pointer; font-size:0.82rem;" @click="selectGovMember(govNominationForm, 'candidate', m)">
                                                                    <span x-text="m.first_name + ' ' + (m.last_name || '')"></span>
                                                                    <span class="mono" style="color:#94a3b8; margin-left:0.4rem;" x-text="m.sangha_sevi_id"></span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                    <div style="position:relative; min-width:15rem;">
                                                        <label class="form-label">Proposer (optional)</label>
                                                        <input type="text" class="form-input" x-model="govNominationForm.proposerQuery"
                                                               @input="onGovMemberSearch(govNominationForm, 'proposer', govSelectedElection && govSelectedElection.organization_pk)" placeholder="Search member…" autocomplete="off">
                                                        <div x-show="govNominationForm.proposerResults.length > 0" style="position:absolute; z-index:20; background:#fff; border:1px solid #e5e7eb; border-radius:0.4rem; width:100%; max-height:14rem; overflow-y:auto; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
                                                            <template x-for="m in govNominationForm.proposerResults" :key="m.sangha_sevi_pk">
                                                                <div style="padding:0.4rem 0.6rem; cursor:pointer; font-size:0.82rem;" @click="selectGovMember(govNominationForm, 'proposer', m)">
                                                                    <span x-text="m.first_name + ' ' + (m.last_name || '')"></span>
                                                                    <span class="mono" style="color:#94a3b8; margin-left:0.4rem;" x-text="m.sangha_sevi_id"></span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                    <button class="btn-action primary" :disabled="govNominationForm.saving" @click="createGovNomination()"

                                                <div style="display:flex; justify-content:center; padding:1rem;" x-show="govNominationsLoading"><div class="spinner"></div></div>
                                                <div class="data-rows" x-show="!govNominationsLoading">
                                                    <div x-show="govNominations.length === 0" style="padding:0.8rem; color:#6b7280;">No nominations yet.</div>
                                                    <template x-for="n in govNominations" :key="n.election_nomination_pk">
                                                        <div class="data-row">
                                                            <span class="data-label">
                                                                <span x-text="n.candidate_name"></span>
                                                                <div class="mono" style="font-size:0.72rem; color:#94a3b8;" x-text="n.position_name + (n.proposer_name ? ' · proposed by ' + n.proposer_name : '')"></div>
                                                            </span>
                                                            <span class="data-value" style="display:flex; align-items:center; gap:0.4rem; justify-content:flex-end; flex-wrap:wrap;">
                                                                <span class="badge badge-xs" :class="govNominationStatusBadge(n.nomination_status)" x-text="n.nomination_status"></span>

                                                                    </span>
                                                                </template>
                                                            </span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- VOTING -->
                                        <div class="data-card" style="margin-bottom:1rem;" x-show="govSelectedElection.election_status === 'VOTING'">

                                                                <template x-for="n in govVotableNominations()" :key="n.election_nomination_pk">

                                                    <div class="alert-msg alert-error" style="margin:0.5rem 0 0;" x-show="govSelfVote.error" x-text="govSelfVote.error"></div>
                                                    <div class="alert-msg alert-success" style="margin:0.5rem 0 0;" x-show="govSelfVote.notice" x-text="govSelfVote.notice"></div>
