                    <!-- ═══ Change Request Modal (Sakha Transfer / Apply for Darshak) ═══
                         Deliberately a sibling of every tab <div>, not nested inside one —
                         the two trigger buttons now live on the Membership tab, and an
                         Alpine x-show="tab === '...'" on an ancestor sets display:none on
                         its whole subtree, which hid this modal whenever it was opened from
                         a tab other than Family. Must stay outside all tab-scoped divs so it
                         shows regardless of which tab is active when the button is clicked. -->
                    <template x-if="showChangeRequestModal">
                        <div style="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;">
                            <!-- Backdrop -->
                            <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);" @click="closeChangeRequestModal()"></div>
                            <!-- Modal -->
                            <div style="position:relative;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.15);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;">
                                <!-- Header -->
                                <div style="padding:1.25rem 1.5rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;">
                                    <div>
                                        <h3 style="margin:0;font-size:1rem;font-weight:700;color:#1B2A4A;" x-text="changeRequestType === 'DARSHAK' ? 'Apply for Darshak' : 'Request Sakha Transfer'"></h3>
                                        <p style="margin:0.25rem 0 0;font-size:0.75rem;color:#6b7280;" x-text="changeRequestType === 'DARSHAK' ? 'Attend another Sangha without transferring your membership — you keep your current Sakha and Local Sakha ERP ID.' : 'Move your affiliation to another Sakha, subject to its approval and your current Sakha\'s release.'"></p>
                                    </div>
                                    <button @click="closeChangeRequestModal()" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.25rem;padding:0.25rem;">✕</button>
                                </div>
                                <!-- Body -->
                                <div style="padding:1.25rem 1.5rem;">
                                    <!-- Error -->
                                    <template x-if="changeRequestError">
                                        <div style="padding:0.5rem 0.75rem;border-radius:0.375rem;background:#fef2f2;border:1px solid #fecaca;font-size:0.75rem;color:#991b1b;margin-bottom:0.75rem;" x-text="changeRequestError"></div>
                                    </template>

                                    <!-- Destination Sakha -->
                                    <div style="margin-bottom:1rem;">
                                        <label style="display:block;font-size:0.75rem;font-weight:600;color:#374151;margin-bottom:0.35rem;" x-text="changeRequestType === 'DARSHAK' ? 'Sakha to attend' : 'Destination Sakha'"></label>
                                        <select x-model="changeRequestOrgPk" class="nss-select">
                                            <option value="">Select Sakha...</option>
                                            <template x-for="s in changeRequestSakhaList" :key="s.organization_pk">
                                                <option :value="s.organization_pk" x-text="s.organization_name"></option>
                                            </template>
                                        </select>
                                        <p x-show="changeRequestSakhaList.length === 0 && !changeRequestSakhaLoading" style="font-size:0.7rem;color:#94a3b8;margin:0.25rem 0 0;">No Sakhas found.</p>
                                    </div>

                                    <!-- Reason -->
                                    <div style="margin-bottom:1rem;">
                                        <label style="display:block;font-size:0.75rem;font-weight:600;color:#374151;margin-bottom:0.35rem;">Reason</label>
                                        <textarea x-model="changeRequestReason" rows="3" placeholder="Optional notes for the reviewing Sakha..." style="width:100%;padding:0.5rem 0.75rem;border:1px solid #d1d5db;border-radius:6px;font-size:0.85rem;outline:none;resize:vertical;box-sizing:border-box;"></textarea>
                                    </div>
                                </div>
                                <!-- Footer -->
                                <div style="padding:1rem 1.5rem;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:0.5rem;">
                                    <button @click="closeChangeRequestModal()" style="padding:0.5rem 1rem;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;font-size:0.8rem;color:#64748b;cursor:pointer;">Cancel</button>
                                    <button @click="submitChangeRequest()" :disabled="changeRequestSaving || !changeRequestOrgPk" style="padding:0.5rem 1.25rem;background:linear-gradient(135deg,#C8960C,#DC7831);color:#fff;border:none;border-radius:6px;font-size:0.8rem;font-weight:600;cursor:pointer;opacity:1;transition:opacity 0.15s;" :style="(!changeRequestOrgPk || changeRequestSaving) ? 'opacity:0.5;cursor:not-allowed;' : ''">
                                        <span x-show="!changeRequestSaving">Submit Request</span>
                                        <span x-show="changeRequestSaving">Submitting...</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ═══ "Applications" Tab (internally tab === 'sendApplication',
                         Correspondence Register approval-chain extension, Tier 6,
                         SOL-ADMIN-009; owner request 2026-10-21; UI label renamed
                         "Send Application" → "Applications" 2026-10-23, owner item 3 —
                         the internal tab key/state property names are deliberately
                         unchanged) ═══ Dedicated top-level tab — deliberately NOT
                         nested inside Membership. Two sub-sections: Create Application
                         (3 addressing modes) and History (every correspondence the
                         member is involved in, any role — GET /my-involvements, owner
                         item 2 fix, 2026-10-22/23 — not just what they sent). A third,
                         conditional section shows any application awaiting THIS
                         member's decision, as either a seated Sakha President (step 1)
                         or a seated Kendra office-bearer (step 2) —
                         /approval-steps/pending-for-me. -->
                    <div x-show="tab === 'sendApplication'">
                        <div class="data-card" style="margin-bottom:1rem;">
                            <div class="data-card-header">
                                <h2 class="data-card-title">Applications</h2>
                                <div style="display:flex;gap:0.5rem;">
                                    <button class="btn-action" :class="{ primary: sendApp.subTab === 'create' }" @click="sendApp.subTab = 'create'">Create Application</button>
                                    <button class="btn-action" :class="{ primary: sendApp.subTab === 'history' }" @click="sendApp.subTab = 'history'; loadSendApplicationHistory()">History</button>
                                </div>
                            </div>

                            <!-- Pending-my-decision banner — visible to anyone with a
                                 step-1 item (seated Sakha President) OR a step-2 item
                                 (seated Kendra office-bearer) awaiting their decision;
                                 most members will never see this. Generalized 2026-10-23
                                 for the step-2 decision fix: sendAppMyStepFor(item) finds
                                 WHICH step belongs to the viewer (step_number can be 1 or
                                 2), so the copy/labels are never hardcoded to "Sakha
                                 President". -->
                            <template x-if="sendApp.pendingApprovals.length > 0">
                                <div class="data-card-body alert-warning" style="border-radius:0;border-bottom:1px solid #f1f5f9;margin-bottom:0;">
                                    <h3 style="margin:0 0 0.5rem;font-size:0.85rem;font-weight:700;">Awaiting your decision</h3>
                                    <template x-for="item in sendApp.pendingApprovals" :key="item.correspondence_pk">
                                        <div style="padding:0.75rem;border:1px solid #fde68a;border-radius:8px;background:#fff;margin-bottom:0.5rem;">
                                            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;flex-wrap:wrap;">
                                                <div>
                                                    <div style="font-weight:600;font-size:0.85rem;" x-text="item.subject"></div>
                                                    <div style="font-size:0.72rem;color:#6b7280;" x-text="'Ref ' + item.reference_number + ' — from ' + (item.sender_person_name || 'member')"></div>
                                                    <div style="font-size:0.72rem;color:#6b7280;margin-top:0.25rem;"
                                                         x-text="'Your role: ' + ((sendAppMyStepFor(item) || {}).approver_position_name || 'Approver') + ' (Step ' + ((sendAppMyStepFor(item) || {}).step_number ?? '?') + ')'"></div>
                                                    <div style="font-size:0.72rem;color:#6b7280;margin-top:0.1rem;" x-text="'Addressed to: ' + (item.recipient_person_name || item.recipient_organization_name || '—')"></div>
                                                </div>
                                                <span class="badge badge-xs" :class="NSS.correspondenceStatusBadgeClass(item.status_value_code)" x-text="item.status_value_code"></span>
                                            </div>

                                            <!-- Visual approval-chain stepper (item 4) — only the
                                                 steps that actually exist render, so a
                                                 step-1-only chain never shows a fake step 2. -->
                                            <template x-if="item.approval_steps && item.approval_steps.length > 0">
                                                <div class="corr-stepper" style="margin-top:0.65rem;">
                                                    <div class="corr-stepper-node">
                                                        <div class="corr-stepper-icon badge-corr-step-done">S</div>
                                                        <div class="corr-stepper-label">
                                                            <div class="corr-stepper-role">Sender</div>
                                                            <div class="corr-stepper-name" x-text="item.sender_person_name || item.sender_external_name || '—'"></div>
                                                        </div>
                                                    </div>
                                                    <template x-for="step in item.approval_steps" :key="step.correspondence_approval_step_pk">
                                                        <div class="corr-stepper-node">
                                                            <div class="corr-stepper-icon" :class="NSS.correspondenceStepIconClass(step.step_status)"
                                                                 x-text="step.step_status === 'APPROVED' ? '✓' : (step.step_status === 'REJECTED' ? '✕' : step.step_number)"></div>
                                                            <div class="corr-stepper-label">
                                                                <template x-if="step.approver_position_code">
                                                                    <span class="badge badge-xs corr-stepper-role" :class="NSS.positionBadgeClass(step.approver_position_code)" x-text="step.approver_position_name"></span>
                                                                </template>
                                                                <template x-if="!step.approver_position_code">
                                                                    <div class="corr-stepper-role" x-text="'Step ' + step.step_number"></div>
                                                                </template>
                                                                <div class="corr-stepper-name" x-text="step.approver_person_name || '—'"></div>
                                                                <div class="text-xs text-base-content/50 italic" x-show="step.acting_person_name">Absent — Acting: <span x-text="step.acting_person_name"></span></div>
                                                                <span class="badge badge-xs" :class="NSS.correspondenceStepBadgeClass(step.step_status)" x-text="step.step_status"></span>
                                                            </div>
                                                        </div>
                                                    </template>
                                                    <div class="corr-stepper-node">
                                                        <div class="corr-stepper-icon" :class="(item.status_value_code === 'ACTIONED' || item.status_value_code === 'CLOSED') ? 'badge-corr-step-done' : 'badge-corr-step-pending'">D</div>
                                                        <div class="corr-stepper-label">
                                                            <div class="corr-stepper-role">Delivered</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>

                                            <template x-if="item.remarks"><div style="font-size:0.78rem;color:#374151;margin-top:0.4rem;" x-text="item.remarks"></div></template>
                                            <textarea class="form-input" rows="2" maxlength="2000" placeholder="Remarks (optional)" x-model="sendApp.decisionRemarks[item.correspondence_pk]" style="margin-top:0.5rem;"></textarea>
                                            <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
                                                <button class="btn-action primary" :disabled="sendApp.deciding" @click="decideSendApplication(item, 'APPROVE')"
                                                        x-text="sendAppApproveLabel(item)"></button>
                                                <button class="btn-action" :disabled="sendApp.deciding" @click="decideSendApplication(item, 'REJECT')">Reject</button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- ── Create Application ───────────────────────── -->
                            <div class="data-card-body" x-show="sendApp.subTab === 'create'">
                                <template x-if="sendApp.error">
                                    <div class="alert-msg alert-error" style="margin-bottom:0.75rem;" x-text="sendApp.error"></div>
                                </template>
                                <!-- Owner report, 2026-10-25: the office-bearer picker
                                     rendered with zero rows and no explanation — a
                                     failed fetch was only ever logged to the console.
                                     officeBearersError surfaces it on screen instead. -->
                                <template x-if="sendApp.officeBearersError">
                                    <div class="alert-msg alert-error" style="margin-bottom:0.75rem;" x-text="sendApp.officeBearersError"></div>
                                </template>

                                <div class="form-group">
                                    <label class="form-label">Address this application to *</label>
                                    <select class="form-input" x-model="sendApp.form.addressing_mode" @change="sendApp.form.recipient_person_pk = ''; _loadSendApplicationOfficeBearers()">
                                        <option value="SAKHA_ORG">My own Sakha (as an organization)</option>
                                        <option value="SAKHA_OFFICE_BEARER">A specific office-bearer of my Sakha</option>
                                        <option value="KENDRA_VIA_SAKHA_PRESIDENT">A Kendra-level office-bearer (routed via my Sakha President)</option>
                                        <!-- Gender-gated (owner-confirmed 2026-10-25): Mahila Parichalana
                                             Mandali modes for FEMALE members only, Sevak Sangha mode for
                                             MALE members only. x-show hides the <option> itself when the
                                             viewer's own gender doesn't match — fails closed (neither shows)
                                             for an unset/unknown gender. Server-side enforced too
                                             (_require_gender() in correspondence.py) — this is UX only. -->
                                        <option value="MAHILA_OFFICE_BEARER" x-show="sendAppIsFemale()">A specific office-bearer of my Sakha's Mahila Parichalana Mandali</option>
                                        <option value="KENDRA_MAHILA_VIA_SAKHA_PRESIDENT" x-show="sendAppIsFemale()">A central Mahila Parichalana Mandali office-bearer (routed via my Sakha President)</option>
                                        <option value="SEVAK_OFFICE_BEARER" x-show="sendAppIsMale()">A specific office-bearer of my Sakha's Sevak Sangha</option>
                                    </select>
                                </div>

                                <!-- Radio-table picker, not a native <select> (owner
                                     request, 2026-10-25) — a plain <option> cannot
                                     render a <span> position badge at all (an HTML
                                     limitation, not a bug), and the old select also
                                     listed the same person twice whenever a delegate
                                     also held a substantive seat of their own (e.g.
                                     the Vice President standing in for the absent
                                     President) — NSS.officeBearerPickerRows() merges
                                     every position a person holds, substantive or
                                     acting, into ONE row with one badge per position.
                                     Same themed radio-table pattern as the "Acting on
                                     My Behalf" picker above. -->
                                <template x-if="sendApp.form.addressing_mode === 'SAKHA_OFFICE_BEARER'">
                                    <div class="form-group">
                                        <label class="form-label">Office-bearer *</label>
                                        <div :class="NSS.govBodyTableClass()">
                                            <table class="table table-sm">
                                                <thead>
                                                    <tr><th></th><th>Name</th><th>Position(s)</th></tr>
                                                </thead>
                                                <tbody>
                                                    <template x-for="row in NSS.officeBearerPickerRows(sendApp.sakhaOfficeBearers)" :key="row.person_pk">
                                                        <tr>
                                                            <td>
                                                                <input type="radio" class="nss-radio" name="send-app-sakha-ob"
                                                                       :disabled="row.disabled"
                                                                       :checked="sendApp.form.recipient_person_pk === row.person_pk"
                                                                       @change="sendApp.form.recipient_person_pk = row.person_pk">
                                                            </td>
                                                            <td class="font-medium" x-text="row.person_name || '—'"></td>
                                                            <td>
                                                                <template x-for="(p, pi) in row.positions" :key="row.person_pk + '-' + pi">
                                                                    <span class="badge badge-sm ml-1" :class="NSS.officeBearerPositionBadgeClass(p)" x-text="NSS.officeBearerPositionLabel(p)"></span>
                                                                </template>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div class="form-hint" x-show="sendApp.sakhaOfficeBearers.length === 0">No office-bearers found for your Sakha.</div>
                                    </div>
                                </template>

                                <template x-if="sendApp.form.addressing_mode === 'KENDRA_VIA_SAKHA_PRESIDENT'">
                                    <div class="form-group">
                                        <label class="form-label">Kendra-level office-bearer *</label>
                                        <div :class="NSS.govBodyTableClass()">
                                            <table class="table table-sm">
                                                <thead>
                                                    <tr><th></th><th>Name</th><th>Position(s)</th></tr>
                                                </thead>
                                                <tbody>
                                                    <template x-for="row in NSS.officeBearerPickerRows(sendApp.kendraOfficeBearers)" :key="row.person_pk">
                                                        <tr>
                                                            <td>
                                                                <input type="radio" class="nss-radio" name="send-app-kendra-ob"
                                                                       :disabled="row.disabled"
                                                                       :checked="sendApp.form.recipient_person_pk === row.person_pk"
                                                                       @change="sendApp.form.recipient_person_pk = row.person_pk">
                                                            </td>
                                                            <td class="font-medium" x-text="row.person_name || '—'"></td>
                                                            <td>
                                                                <template x-for="(p, pi) in row.positions" :key="row.person_pk + '-' + pi">
                                                                    <span class="badge badge-sm ml-1" :class="NSS.officeBearerPositionBadgeClass(p)" x-text="NSS.officeBearerPositionLabel(p)"></span>
                                                                </template>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div class="form-hint" x-show="sendApp.kendraOfficeBearers.length === 0">No Kendra office-bearers found.</div>
                                        <div class="form-hint">This application first goes to your Sakha President for approval; it only becomes visible to the Kendra office-bearer once approved.</div>
                                    </div>
                                </template>

                                <!-- Added 2026-10-25 (owner-confirmed gender-gated modes):
                                     MAHILA_OFFICE_BEARER — same single-step shape as
                                     SAKHA_OFFICE_BEARER above, backed by sendApp.mahilaOfficeBearers
                                     (the member's own Sakha's Mahila Parichalana Mandali only). -->

                                                            <td>
                                                                <input type="radio" class="nss-radio" name="send-app-mahila-ob"

                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div class="form-hint" x-show="sendApp.mahilaOfficeBearers.length === 0">No Mahila Parichalana Mandali office-bearers found for your Sakha.</div>
                                    </div>
                                </template>

                                <!-- KENDRA_MAHILA_VIA_SAKHA_PRESIDENT — same 2-step shape as
                                     KENDRA_VIA_SAKHA_PRESIDENT above, targeting the central
                                     (Kendra-level, NSS-wide) Mahila Parichalana Mandali instead

                                <template x-if="sendApp.form.addressing_mode === 'KENDRA_MAHILA_VIA_SAKHA_PRESIDENT'">

                                    </div>

                                <!-- SEVAK_OFFICE_BEARER — same single-step shape as
                                     SAKHA_OFFICE_BEARER / MAHILA_OFFICE_BEARER above, backed by
                                     sendApp.sevakOfficeBearers (the member's own Sakha's Sevak
                                     Sangha only). -->
                                <template x-if="sendApp.form.addressing_mode === 'SEVAK_OFFICE_BEARER'">
                                    <div class="form-group">
                                        <label class="form-label">Sevak Sangha office-bearer *</label>
                                        <div :class="NSS.govBodyTableClass()">
                                            <table class="table table-sm">
                                                <thead>
                                                    <tr><th></th><th>Name</th><th>Position(s)</th></tr>

                                                <div style="font-weight:600;font-size:0.85rem;" x-text="item.subject"></div>

                                                </div>
                                            </div>
                                            <div style="display:flex;gap:0.4rem;align-items:center;">
                                                <span class="badge badge-xs" :class="NSS.correspondenceStatusBadgeClass(item.status_value_code)" x-text="item.status_value_code"></span>
                                            </div>
                                        </div>
                                        <div x-show="sendApp.expandedPk === item.correspondence_pk" style="padding:0.75rem;border-top:1px solid #f1f5f9;background:#f8fafc;font-size:0.78rem;">

                                            <div style="margin-top:0.25rem;"><strong>Responsible party:</strong> <span x-text="item.responsible_person_pk ? 'Assigned' : 'Not yet assigned'"></span></div>

                                            <!-- Visual approval-chain stepper (item 4) — same
                                                 pattern as the pending-decision banner above;
                                                 only real steps render, so a step-1-only chain

                                                 step 2 node. -->
                                            <template x-if="item.approval_steps && item.approval_steps.length > 0">

                                                    <div class="corr-stepper" style="margin-top:0.5rem;">
                                                        <div class="corr-stepper-node">
                                                            <div class="corr-stepper-icon badge-corr-step-done">S</div>
                                                            <div class="corr-stepper-label">
                                                                <div class="corr-stepper-role">Sender</div>
                                                                <div class="corr-stepper-name" x-text="item.sender_person_name || item.sender_external_name || '—'"></div>
                                                            </div>
                                                        </div>
                                                        <template x-for="step in item.approval_steps" :key="step.correspondence_approval_step_pk">
                                                            <div class="corr-stepper-node">
                                                                <div class="corr-stepper-icon" :class="NSS.correspondenceStepIconClass(step.step_status)"
                                                                     x-text="step.step_status === 'APPROVED' ? '✓' : (step.step_status === 'REJECTED' ? '✕' : step.step_number)"></div>
                                                                <div class="corr-stepper-label">
                                                                    <template x-if="step.approver_position_code">
                                                                    <span class="badge badge-xs corr-stepper-role" :class="NSS.positionBadgeClass(step.approver_position_code)" x-text="step.approver_position_name"></span>
                                                                </template>
                                                                <template x-if="!step.approver_position_code">
                                                                    <div class="corr-stepper-role" x-text="'Step ' + step.step_number"></div>
                                                                </template>
                                                                    <div class="corr-stepper-name" x-text="step.approver_person_name || '—'"></div>
                                                                    <span class="badge badge-xs" :class="NSS.correspondenceStepBadgeClass(step.step_status)" x-text="step.step_status"></span>
                                                                    <template x-if="step.remarks"><div style="font-size:0.68rem;color:#9ca3af;" x-text="step.remarks"></div></template>
                                                                </div>
                                                            </div>
                                                        </template>
                                                        <div class="corr-stepper-node">
                                                            <div class="corr-stepper-icon" :class="(item.status_value_code === 'ACTIONED' || item.status_value_code === 'CLOSED') ? 'badge-corr-step-done' : 'badge-corr-step-pending'">D</div>
                                                            <div class="corr-stepper-label">
                                                                <div class="corr-stepper-role">Delivered</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
