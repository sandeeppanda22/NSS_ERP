                    <!-- ═══ Attendance Register Tab (owner ask 2026-10-28:
                         "not in sakha dashboard add it in member left nav
                         bar") ═══ For a designated marker (ATTENDANCE_MANAGE)
                         to record Weekly Sangha Puja attendance, with no
                         administration access needed. The marking grid
                         (roster/tallies/filter/search-to-add/submit) is the
                         SHARED NSSAttendanceRegister mixin (assets/js/
                         attendance-register.js) — the very code the
                         Administration > Attendance tab runs. The
                         ATT-MARK-SEARCH sub-block below is kept IDENTICAL
                         (modulo indentation) to its other copies in
                         admin.html — this project has no HTML include
                         mechanism, so if you edit one copy you MUST edit
                         all of them. -->
                    <div x-show="tab === 'attendanceRegister'">
                        <h1 class="text-2xl font-bold mb-1">Attendance Register</h1>
                        <p class="text-sm text-base-content/60 mb-6">Record Weekly Sangha Puja attendance for your Sakha.</p>

                        <div class="alert-msg alert-error" x-show="!attRegSakhaOptions.length">
                            No Sakha found for your Attendance Register access — contact an administrator.
                        </div>

                        <!-- Sakha picker — a plain line when there is only one
                             (the common case), a dropdown when a marker or
                             Sakha admin holds several. -->
                        <p class="text-sm font-medium mb-4" x-show="attRegSakhaOptions.length === 1" x-text="attRegSakhaOptions[0].organization_name"></p>
                        <div class="data-card mb-4" x-show="attRegSakhaOptions.length > 1">
                            <div class="card-body p-4">
                                <label class="form-label" for="attRegSakhaSelect">Sakha</label>
                                <select id="attRegSakhaSelect" class="form-input" style="max-width:24rem;"
                                        x-model="attRegSakhaPk" @change="onAttRegSakhaChange()">
                                    <option value="">Select a Sakha…</option>
                                    <template x-for="o in attRegSakhaOptions" :key="o.organization_pk">
                                        <option :value="o.organization_pk" x-text="o.organization_name"></option>
                                    </template>
                                </select>
                            </div>
                        </div>

                        <template x-if="attRegSakhaPk">
                        <div>

                            <!-- Puja picker (hidden while a puja is open for marking) -->
                            <div class="data-card mb-4" x-show="!attMarkPuja">
                                <div class="data-card-header">
                                    <h3 class="data-card-title">Weekly Sangha Puja</h3>
                                    <button type="button" class="btn-action" @click="attRegForm.show = !attRegForm.show">
                                        <span x-text="attRegForm.show ? 'Cancel' : '+ New Puja'"></span>
                                    </button>
                                </div>
                                <div class="data-card-body" x-show="attRegForm.show" x-cloak>
                                    <div class="alert-msg alert-error" x-show="attRegForm.error" x-text="attRegForm.error"></div>
                                    <div style="display:flex; gap:0.75rem; align-items:flex-end; flex-wrap:wrap;">
                                        <div class="form-group" style="margin:0;">
                                            <label class="form-label" for="attRegPujaDate">Puja date</label>
                                            <input id="attRegPujaDate" type="date" class="form-input" x-model="attRegForm.puja_date">
                                        </div>
                                        <div class="form-group" style="margin:0; flex:1 1 14rem;">
                                            <label class="form-label" for="attRegPujaRemarks">Remarks (optional)</label>
                                            <input id="attRegPujaRemarks" type="text" class="form-input" x-model="attRegForm.remarks">
                                        </div>
                                        <button type="button" class="btn-action primary" :disabled="attRegForm.saving || !attRegForm.puja_date"
                                                @click="submitCreateAttRegPuja()">
                                            <span x-text="attRegForm.saving ? 'Creating…' : 'Create & Mark'"></span>
                                        </button>
                                    </div>
                                </div>
                                <div class="data-card-body">
                                    <div style="display:flex; align-items:center; justify-content:center; padding:1.5rem;" x-show="attRegPujasLoading">
                                        <div class="spinner"></div>
                                    </div>
                                    <div class="alert-msg alert-error" x-show="attRegPujasError" x-text="attRegPujasError"></div>
                                    <div class="overflow-x-auto" x-show="!attRegPujasLoading && attRegPujas.length">
                                        <table class="table table-sm">
                                            <thead>
                                                <tr><th>Puja Date</th><th>Status</th><th>Marked</th><th>Present</th><th>Absent</th><th>Excused</th><th></th></tr>
                                            </thead>
                                            <tbody>
                                                <template x-for="p in attRegPujas" :key="p.weekly_sangha_puja_pk">
                                                    <tr>
                                                        <td x-text="p.puja_date"></td>
                                                        <td><span class="badge badge-sm" :class="p.puja_status === 'CONDUCTED' ? 'badge-success' : 'badge-muted'" x-text="p.puja_status"></span></td>
                                                        <td x-text="p.marked_count"></td>
                                                        <td x-text="p.present_count"></td>
                                                        <td x-text="p.absent_count"></td>
                                                        <td x-text="p.excused_count"></td>
                                                        <td>
                                                            <button type="button" class="btn-action" style="padding:0.15rem 0.6rem; font-size:0.72rem;"
                                                                    @click="openMarkAttendance(p)" x-text="p.marked_count ? 'Edit Attendance' : 'Mark Attendance'"></button>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                    <div x-show="!attRegPujasLoading && !attRegPujas.length" style="padding:0.5rem 0; color:#6b7280; font-size:0.85rem;">
                                        No Weekly Sangha Puja recorded yet — use “+ New Puja” to add one.
                                    </div>
                                </div>
                            </div>

                            <!-- Marking grid — all shared-mixin state -->
                            <template x-if="attMarkPuja">
                                <div class="data-card">
                                    <div class="data-card-header">
                                        <h3 class="data-card-title" x-text="'Weekly Sangha Puja — ' + attMarkPuja.puja_date"></h3>
                                        <button type="button" class="btn-action" @click="closeMarkAttendance()">Close</button>
                                    </div>
                                    <div class="data-card-body">
                                        <div style="display:flex; align-items:center; justify-content:center; padding:1.5rem;" x-show="attMarkLoading">
                                            <div class="spinner"></div>
                                        </div>
                                        <div class="alert-msg alert-error" x-show="attMarkError" x-text="attMarkError"></div>

                                        <template x-if="!attMarkLoading && attMarkRows.length">
                                            <div>
                                                <!-- Live tallies -->
                                                <div class="data-card" style="margin-bottom:1rem; background:#f8fafc;">
                                                    <div class="card-body p-4" style="display:flex; flex-direction:row; gap:1.75rem; align-items:center; flex-wrap:wrap;">
                                                        <div style="text-align:center;">
                                                            <div class="text-2xl font-bold" style="color:#16a34a;" x-text="attMarkCounts.present"></div>
                                                            <div class="text-xs text-base-content/50">Present</div>
                                                        </div>
                                                        <div style="text-align:center;">
                                                            <div class="text-2xl font-bold" style="color:#dc2626;" x-text="attMarkCounts.absent"></div>
                                                            <div class="text-xs text-base-content/50">Absent</div>
                                                        </div>
                                                        <div style="text-align:center;">
                                                            <div class="text-2xl font-bold" style="color:#d97706;" x-text="attMarkCounts.excused"></div>
                                                            <div class="text-xs text-base-content/50">Excused</div>
                                                        </div>
                                                        <div style="text-align:center;">
                                                            <div class="text-2xl font-bold text-base-content/40" x-text="attMarkCounts.total"></div>
                                                            <div class="text-xs text-base-content/50">Total</div>
                                                        </div>
                                                        <div style="flex:1; text-align:right; min-width:150px;">
                                                            <div class="text-sm font-medium" x-text="(attMarkCounts.percentage ?? '—') + (attMarkCounts.percentage !== null ? '% attendance' : '')"></div>
                                                            <div class="att-bar" style="width:8rem; margin-left:auto; margin-top:0.25rem;"><div class="att-bar-fill" :style="'width:' + (attMarkCounts.percentage || 0) + '%'"></div></div>
                                                        </div>
                                                    </div>
                                                </div>

                                                <!-- Quick filter chips + bulk set -->
                                                <div style="display:flex; gap:0.5rem; margin-bottom:0.75rem; flex-wrap:wrap; align-items:center;">
                                                    <span class="badge" :class="attMarkFilter === 'ALL' ? 'badge-identity' : 'badge-muted'" style="cursor:pointer;"
                                                          @click="attMarkFilter = 'ALL'" x-text="'All (' + attMarkCounts.total + ')'"></span>
                                                    <span class="badge" :class="attMarkFilter === 'PRESENT' ? 'badge-att-present' : 'badge-muted'" style="cursor:pointer;"
                                                          @click="attMarkFilter = 'PRESENT'" x-text="'Present (' + attMarkCounts.present + ')'"></span>
                                                    <span class="badge" :class="attMarkFilter === 'ABSENT' ? 'badge-att-absent' : 'badge-muted'" style="cursor:pointer;"
                                                          @click="attMarkFilter = 'ABSENT'" x-text="'Absent (' + attMarkCounts.absent + ')'"></span>
                                                    <span class="badge" :class="attMarkFilter === 'EXCUSED_ABSENCE' ? 'badge-att-excused_absence' : 'badge-muted'" style="cursor:pointer;"
                                                          @click="attMarkFilter = 'EXCUSED_ABSENCE'" x-text="'Excused (' + attMarkCounts.excused + ')'"></span>
                                                    <span style="flex:1;"></span>
                                                    <span class="text-xs text-base-content/50">Mark all shown:</span>
                                                    <button type="button" class="att-toggle active-present" @click="attMarkSetAll('PRESENT')">P</button>
                                                    <button type="button" class="att-toggle active-absent" @click="attMarkSetAll('ABSENT')">A</button>
                                                    <button type="button" class="att-toggle active-excused" @click="attMarkSetAll('EXCUSED_ABSENCE')">E</button>
                                                </div>

                                                <!-- ATT-MARK-SEARCH:START (identical to admin.html's Attendance tab) -->
                                                <div style="margin:0 0 0.75rem; position:relative; max-width:32rem;">
                                                    <div class="att-search">
                                                        <svg class="att-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                                                        </svg>
                                                        <input type="text" class="att-search-input" x-model="attMarkSearchQuery" @input="searchAttMarkMember()"
                                                               placeholder="Add a member — search name, Sangha Sevi ID, or local Sakha number…">
                                                        <button type="button" class="att-search-clear" x-show="attMarkSearchQuery" @click="attMarkClearSearch()" aria-label="Clear search">&times;</button>
                                                    </div>
                                                    <div class="att-search-hint" x-show="attMarkSearching">Searching…</div>
                                                    <div class="att-search-hint" x-show="!attMarkSearching && attMarkSearchQuery.trim().length === 1">Keep typing — at least 2 characters.</div>
                                                    <div class="att-search-hint" x-show="!attMarkSearching && attMarkSearchQuery.trim().length > 1 && !attMarkSearchResults.length">No one found, or everyone matching is already listed below.</div>
                                                    <div class="att-search-results att-search-float" x-show="attMarkSearchResults.length" x-cloak>
                                                        <template x-for="m in attMarkSearchResults" :key="m.sangha_sevi_pk">
                                                            <div class="att-search-row att-search-pick" @click="addAttMarkMember(m)">
                                                                <div class="att-search-avatar" x-text="_attInitials(m)"></div>
                                                                <div class="att-search-info">
                                                                    <div class="att-search-name" x-text="[m.first_name, m.middle_name, m.last_name].filter(Boolean).join(' ')"></div>
                                                                    <div class="att-search-meta">
                                                                        <span x-text="m.sangha_sevi_id + (m.local_sakha_erp_id ? ' / ' + m.local_sakha_erp_id : '')"></span>
                                                                        <span x-show="attMarkPuja && m.organization_pk !== attMarkPuja.sakha_pk" x-text="' · Darshak from ' + m.organization_name"></span>
                                                                    </div>
                                                                </div>
                                                                <div class="att-search-actions">
                                                                    <span class="btn-action" style="padding:0.1rem 0.6rem; font-size:0.72rem;">+ Add</span>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                                <!-- ATT-MARK-SEARCH:END -->

                                                <div class="overflow-x-auto">
                                                    <table class="table table-sm">
                                                        <thead>
                                                            <tr><th>Sangha Sevi ID</th><th>Local Sakha No.</th><th>Name</th><th style="text-align:center;">Status</th></tr>
                                                        </thead>
                                                        <tbody>
                                                            <template x-for="row in attMarkHomeRows()" :key="row.sangha_sevi_pk">
                                                                <tr>
                                                                    <td class="font-mono text-sm" x-text="row.sangha_sevi_id"></td>
                                                                    <td class="font-mono text-sm" x-text="row.local_sakha_erp_id || '—'"></td>
                                                                    <td class="font-medium" x-text="row.person_name"></td>
                                                                    <td style="text-align:center;">
                                                                        <div style="display:inline-flex; gap:0.3rem;">
                                                                            <button type="button" class="att-toggle" :class="{ 'active-present': row.attendance_status_code === 'PRESENT' }"
                                                                                    @click="row.attendance_status_code = 'PRESENT'">P</button>
                                                                            <button type="button" class="att-toggle" :class="{ 'active-absent': row.attendance_status_code === 'ABSENT' }"
                                                                                    @click="row.attendance_status_code = 'ABSENT'">A</button>
                                                                            <button type="button" class="att-toggle" :class="{ 'active-excused': row.attendance_status_code === 'EXCUSED_ABSENCE' }"
                                                                                    @click="row.attendance_status_code = 'EXCUSED_ABSENCE'">E</button>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </tbody>
                                                    </table>
                                                </div>

                                                <!-- Darshak (Visitors) — cross-Sakha attendees added via search (ATT-029/030) -->
                                                <div x-show="attMarkDarshakRows().length" style="margin-top:1.25rem;">
                                                    <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem;">
                                                        <h3 class="text-base font-semibold" style="color:#0284c7;">Darshak (Visitors)</h3>
                                                        <span class="badge badge-sm badge-org" x-text="attMarkDarshakRows().length"></span>
                                                    </div>
                                                    <div class="overflow-x-auto" style="background:#f0f9ff; border:1px solid #bae6fd; border-radius:0.5rem;">
                                                        <table class="table table-sm">
                                                            <thead>
                                                                <tr><th>Sangha Sevi ID</th><th>Name</th><th>Home Sakha</th><th style="text-align:center;">Status</th></tr>
                                                            </thead>
                                                            <tbody>
                                                                <template x-for="row in attMarkDarshakRows()" :key="row.sangha_sevi_pk">
                                                                    <tr>
                                                                        <td class="font-mono text-sm" x-text="row.sangha_sevi_id"></td>
                                                                        <td class="font-medium" x-text="row.person_name"></td>
                                                                        <td x-text="row.home_org_name"></td>
                                                                        <td style="text-align:center;">
                                                                            <div style="display:inline-flex; gap:0.3rem;">
                                                                                <button type="button" class="att-toggle" :class="{ 'active-present': row.attendance_status_code === 'PRESENT' }"
                                                                                        @click="row.attendance_status_code = 'PRESENT'">P</button>
                                                                                <button type="button" class="att-toggle" :class="{ 'active-absent': row.attendance_status_code === 'ABSENT' }"
                                                                                        @click="row.attendance_status_code = 'ABSENT'">A</button>
                                                                                <button type="button" class="att-toggle" :class="{ 'active-excused': row.attendance_status_code === 'EXCUSED_ABSENCE' }"
                                                                                        @click="row.attendance_status_code = 'EXCUSED_ABSENCE'">E</button>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                </template>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>

                                                <div style="display:flex; justify-content:flex-end; margin-top:1rem;">
                                                    <button type="button" class="btn-action primary" :disabled="attMarkSaving" @click="submitMarkAttendance()">
                                                        <span x-text="attMarkSaving ? 'Saving…' : 'Submit Attendance'"></span>
                                                    </button>
                                                </div>
                                            </div>
                                        </template>

                                        <div x-show="!attMarkLoading && !attMarkRows.length" style="padding:1rem; color:#6b7280; font-size:0.85rem;">
                                            No active members found for this Sakha.
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                        </template>
                    </div>

                    <!-- ═══ Governance Tab ═══ -->
                    <div x-show="tab === 'governance'">
                        <h1 class="text-2xl font-bold mb-1">Governance</h1>
                        <p class="text-sm text-base-content/60 mb-6">Statutory NSS-wide bodies and your Sakha's Governing Body.</p>

                        <!-- ═══ Parichalak-only: probationary candidate exception (GOV-BR-043-A) ═══ -->
                        <div class="mb-8" x-show="isParichalak" x-cloak>
                            <div class="card bg-base-100 border border-base-200 shadow-sm">
                                <div class="card-body p-5">
                                    <div class="flex items-start justify-between gap-2 flex-wrap">
                                        <div>
                                            <h2 class="text-lg font-semibold">Probationary Candidate Exception</h2>
                                            <p class="text-xs text-base-content/50">As the seated Parichalak, you may nominate a Darshaka (probationary) member for Sakha President or Secretary with a valid Anumati Patra (GOV-BR-043-A).</p>
                                        </div>
                                        <button class="btn btn-sm" @click="toggleParichalakExceptionForm()"
                                                x-text="parichalakExceptionForm.show ? 'Cancel' : 'New Nomination'"></button>
                                    </div>

                                    <div x-show="parichalakExceptionForm.show" x-cloak class="mt-4 pt-4 border-t border-base-200 flex flex-col gap-3">
                                        <div class="alert-msg alert-error" x-show="parichalakExceptionForm.error" x-text="parichalakExceptionForm.error"></div>
                                        <div class="alert-msg alert-success" x-show="parichalakExceptionForm.success" x-text="parichalakExceptionForm.success"></div>

                                        <div>
                                            <label class="form-label">Election</label>
                                            <select class="form-input" x-model="parichalakExceptionForm.election_pk" @change="onParichalakExceptionElectionChange()">
                                                <option value="">Select…</option>
                                                <template x-for="el in parichalakExceptionForm.elections" :key="el.election_pk">
                                                    <option :value="el.election_pk" x-text="el.election_name + ' — ' + el.body_name"></option>
                                                </template>
                                            </select>
                                            <p class="text-xs text-base-content/40 mt-1" x-show="parichalakExceptionForm.electionsLoading">Loading elections…</p>
                                        </div>

                                        <div x-show="parichalakExceptionForm.election_pk">
                                            <label class="form-label">Position</label>
                                            <select class="form-input" x-model="parichalakExceptionForm.position_master_pk">
                                                <option value="">Select…</option>
                                                <template x-for="p in parichalakExceptionForm.positions" :key="p.position_master_pk">
                                                    <option :value="p.position_master_pk" x-text="p.position_name"></option>
                                                </template>
                                            </select>
                                            <p class="text-xs text-base-content/40 mt-1" x-show="parichalakExceptionForm.positionsLoading">Loading positions…</p>
                                        </div>

                                        <div style="position:relative;">
                                            <label class="form-label">Candidate (probationary member)</label>
                                            <input type="text" class="form-input" x-model="parichalakExceptionForm.candidateQuery"
                                                   @input="onParichalakExceptionCandidateSearch()" placeholder="Search member…" autocomplete="off">
                                            <div x-show="parichalakExceptionForm.candidateResults.length > 0" style="position:absolute; z-index:20; background:#fff; border:1px solid #e5e7eb; border-radius:0.4rem; width:100%; max-height:14rem; overflow-y:auto; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
                                                <template x-for="m in parichalakExceptionForm.candidateResults" :key="m.person_pk">
                                                    <div style="padding:0.4rem 0.6rem; cursor:pointer; font-size:0.82rem;" @click="selectParichalakExceptionCandidate(m)">
                                                        <span x-text="m.first_name + ' ' + (m.last_name || '')"></span>
                                                        <span class="mono" style="color:#94a3b8; margin-left:0.4rem;" x-text="m.sangha_sevi_id"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>

                                        <div>
                                            <label class="form-label">Reason for exception</label>
                                            <textarea class="form-input" rows="2" x-model="parichalakExceptionForm.probationary_exception_reason"
                                                      placeholder="Why is this probationary candidate being permitted to stand?"></textarea>
                                        </div>

                                        <div>
                                            <button class="btn-action primary" :disabled="parichalakExceptionForm.saving" @click="submitParichalakException()"
                                                    x-text="parichalakExceptionForm.saving ? 'Saving…' : 'Submit Nomination'"></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ═══ Open Elections — Cast Your Vote ═══
                             Item 8: the entire section (header + cards) is hidden
                             unless the server returned at least one election open for
                             this member's scope. Nothing is shown while loading or on
                             error — govOpenElections is only non-empty on success. -->
                        <div class="mb-8" x-show="govOpenElections.length">
                            <h2 class="text-lg font-semibold mb-3">Open Elections — Cast Your Vote</h2>

                            <template x-for="el in govOpenElections" :key="el.election_pk">
                                        <div class="card bg-base-100 border border-base-200 shadow-sm mb-5">
                                            <div class="card-body p-5">
                                                <div class="flex items-start justify-between gap-2 flex-wrap">
                                                    <div>
                                                        <h3 class="font-semibold" x-text="el.election_name"></h3>
                                                        <p class="text-xs text-base-content/50" x-text="el.body_name"></p>
                                                    </div>
                                                    <div class="flex items-center gap-2">
                                                        <span class="badge badge-sm" :class="el.is_secret_ballot ? 'badge-identity' : 'badge-muted'" x-text="el.is_secret_ballot ? 'Secret Ballot' : 'Open Ballot'"></span>
                                                        <span class="badge badge-sm badge-muted" x-show="el.voting_end_date" x-text="'Closes ' + govMonthYear(el.voting_end_date)"></span>
                                                    </div>
                                                </div>

                                                <div class="alert-msg alert-error mt-3" x-show="govVoteError[el.election_pk]" x-text="govVoteError[el.election_pk]"></div>
                                                <div class="alert-msg alert-success mt-3" x-show="govVoteSuccess[el.election_pk]" x-text="govVoteSuccess[el.election_pk]"></div>

                                                <template x-for="pos in govPositionsForElection(el)" :key="el.election_pk + '-' + pos.position_master_pk">
                                                    <div class="mt-4 pt-4 border-t border-base-200">
                                                        <div class="flex items-center justify-between gap-2 mb-2">
                                                            <h4 class="text-sm font-semibold" x-text="pos.position_name"></h4>
                                                            <span class="badge badge-sm badge-success" x-show="el.voted_position_pks.includes(pos.position_master_pk)">You Voted</span>
                                                        </div>

                                                        <template x-if="!el.voted_position_pks.includes(pos.position_master_pk)">
                                                            <div>
                                                                <div class="flex flex-col gap-2 mb-3">
                                                                    <template x-for="cand in pos.candidates" :key="cand.election_nomination_pk">
                                                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                                                            <input type="radio" class="nss-radio" :name="'vote-' + el.election_pk + '-' + pos.position_master_pk"
                                                                                   :value="cand.election_nomination_pk"
                                                                                   @change="govSelectedNomination[el.election_pk + '-' + pos.position_master_pk] = cand.election_nomination_pk">
                                                                            <span x-text="cand.candidate_name"></span>
                                                                        </label>
                                                                    </template>
                                                                </div>
                                                                <button type="button" class="btn btn-sm btn-primary"
                                                                        :disabled="!govSelectedNomination[el.election_pk + '-' + pos.position_master_pk] || govVoteSubmitting[el.election_pk + '-' + pos.position_master_pk]"
                                                                        @click="castMySelfVote(el, pos.position_master_pk)">
                                                                    <span x-show="govVoteSubmitting[el.election_pk + '-' + pos.position_master_pk]" class="spinner spinner-sm"></span>
                                                                    Cast My Vote
                                                                </button>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                            </template>
                        </div>

                        <!-- ═══ Awaiting My Approval (Priority 1, 2026-10-24) ═══
                             Admin-initiated acting assignments naming the caller as
                             the nominee — PENDING_APPROVAL rows sit here until the
                             caller approves or rejects them. Visible to ANY logged-in
                             member (not just office-bearers) since anyone can be
                             nominated to act for someone else. Reuses the same
                             ActingAssignmentResponse shape as everywhere else;
                             GET /me/pending-acting-approvals. -->
                        <div class="mb-8" x-show="myPendingActingApprovals.length > 0" x-cloak>
                            <div :class="NSS.govBodyCardClass()">
                                <div class="card-body p-5">
                                    <h2 :class="NSS.govBodyTitleClass()">Awaiting My Approval</h2>
                                    <p class="text-xs text-base-content/60 mt-1">
                                        An admin has named you to act on another member's behalf. Approve to
                                        start acting in that position, or reject if you are not available.
                                    </p>
                                    <div class="alert-msg alert-error mt-3" x-show="myPendingActingApprovalsError" x-text="myPendingActingApprovalsError"></div>
                                    <div class="overflow-x-auto bg-violet-100 rounded-xl shadow-sm mt-4 gov-body-table">
                                        <table class="table table-sm">
                                            <thead>
                                                <tr>
                                                    <th>Position</th>
                                                    <th>Governance Body</th>
                                                    <th>Period</th>
                                                    <th>Reason</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template x-for="a in myPendingActingApprovals" :key="a.acting_position_assignment_pk">
                                                    <tr>
                                                        <td><span class="badge badge-sm" :class="NSS.positionBadgeClass(a.position_code)" x-text="a.position_name"></span></td>
                                                        <td x-text="a.body_name || '—'"></td>
                                                        <td class="text-sm" x-text="a.effective_from + (a.effective_to ? ' – ' + a.effective_to : ' – present')"></td>
                                                        <td class="text-sm" x-text="a.reason || '—'"></td>
                                                        <td>
                                                            <button class="btn-action success" style="padding: 0.15rem 0.6rem; font-size: 0.72rem;"
                                                                    @click="decideMyPendingActingApproval(a, 'approve')">Approve</button>
                                                            <button class="btn-action danger" style="padding: 0.15rem 0.6rem; font-size: 0.72rem;"
                                                                    @click="decideMyPendingActingApproval(a, 'reject')">Reject</button>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ═══ Acting on My Behalf (owner asks #2/#3/#4) ═══
                             Office-bearers only: the entire section is hidden unless
                             GET /governance/me/positions returned at least one body on
                             which this member currently holds an office-bearer seat.
                             An ordinary member sees nothing at all — not even an empty
                             card. Styled with the shared governance-box constants
                             (NSS.govBodyCardClass() etc.) but deliberately NOT a
                             GOV-BODY-CARD marker block (that one is the body-
                             composition card and its three copies are byte-identity-
                             tested). -->
                        <div class="mb-8" x-show="myGovPositions.length > 0" x-cloak>
                            <div :class="NSS.govBodyCardClass()">
                                <div class="card-body p-5">
                                    <div class="flex items-start justify-between gap-2 flex-wrap">
                                        <h2 :class="NSS.govBodyTitleClass()">Acting on My Behalf</h2>
                                        <!-- Current/History sub-tabs — same pattern as the
                                             Applications tab's Create Application/History
                                             toggle (owner request, 2026-10-25). -->
                                        <div style="display:flex;gap:0.5rem;">
                                            <button type="button" class="btn-action" :class="{ primary: myGovDelegationsView === 'current' }" @click="myGovDelegationsView = 'current'">Current</button>
                                            <button type="button" class="btn-action" :class="{ primary: myGovDelegationsView === 'history' }" @click="myGovDelegationsView = 'history'">History</button>
                                        </div>
                                    </div>
                                    <p class="text-xs text-base-content/60 mt-1" x-show="myGovDelegationsView === 'current'">
                                        Nominate another member of the same body to act on your behalf in a
                                        position you currently hold. You can only delegate your own seats.
                                    </p>

                                    <!-- ── Form stage ── -->
                                    <div x-show="myGovDelegationsView === 'current' && delegateForm.stage === 'form'" class="mt-4 flex flex-col gap-3">
                                        <div class="alert-msg alert-error" style="margin:0;" x-show="delegateForm.error" x-text="delegateForm.error"></div>

                                        <!-- One candidate table PER delegation slot, every
                                             table mandatory (owner ask #1, 2026-10-24:
                                             "every body should get their own table.. after
                                             selecting the on behalf they selected persons
                                             should be in a single table for confirmation.
                                             for this you have to make all table (indivual
                                             body table) mandatory to select."). This
                                             reverses the previous round's single combined
                                             table — deliberate.
                                             A "slot" is a (body, position-the-caller-holds)
                                             pair; each gets its OWN radio group (name =
                                             slot.key) writing into
                                             delegateForm.selections[slot.key], and its own
                                             per-body-type table colour via
                                             NSS.govBodyTableClass(slot.body_type_code)
                                             (owner ask #2). Slots that already have a live
                                             delegation, and the caller themselves, are
                                             filtered out in myGovDelegationSlots(). -->
                                        <template x-for="slot in myGovDelegationSlots()" :key="slot.key">
                                            <div>
                                                <label class="form-label" x-text="slot.title + ' — Member to Act on Your Behalf'"></label>
                                                <div :class="NSS.govBodyTableClass(slot.body_type_code)">
                                                    <table class="table table-sm">
                                                        <thead>
                                                            <tr>
                                                                <th></th>
                                                                <th>Candidate</th>
                                                                <th>Candidate's Position</th>
                                                                <th>Governance Body</th>
                                                                <th>Your Position Being Delegated</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <template x-for="c in slot.candidates" :key="slot.key + '|' + c.person_pk">
                                                                <tr>
                                                                    <td>
                                                                        <input type="radio" class="nss-radio" :name="'delegate-' + slot.key"
                                                                               :checked="delegateForm.selections[slot.key] === c.person_pk"
                                                                               @change="selectDelegateFor(slot, c.person_pk)">
                                                                    </td>
                                                                    <td>
                                                                        <span class="font-medium" x-text="c.person_name || '—'"></span>
                                                                        <span class="font-mono text-xs text-base-content/50 ml-1" x-text="c.sangha_sevi_id || ''"></span>
                                                                    </td>
                                                                    <td><span class="badge badge-sm" :class="NSS.positionBadgeClass(c.position_code)" x-text="c.position_name"></span></td>
                                                                    <td x-text="slot.body_name"></td>
                                                                    <td><span class="badge badge-sm" :class="NSS.positionBadgeClass(slot.my_position_code)" x-text="slot.my_position_name"></span></td>
                                                                </tr>
                                                            </template>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </template>

                                        <p class="text-xs text-base-content/50" x-show="myGovDelegationSlots().length === 0">
                                            No remaining positions available to delegate.
                                        </p>

                                        <!-- Shared date range + reason: ONE set for the whole
                                             batch (owner's single-confirmation-table framing).
                                             Hidden, with the Assign button, when there is
                                             nothing left to delegate. -->
                                        <div class="flex gap-3 flex-wrap items-center" x-show="myGovDelegationSlots().length > 0">
                                            <div x-data="nssDatePicker('delegateForm.effective_from')" style="position:relative; max-width:11rem;" data-dp-input-class="form-input">
                                                <label class="form-label">Effective From</label>
                                            </div>
                                            <div x-data="nssDatePicker('delegateForm.effective_to')" style="position:relative; max-width:11rem;" data-dp-input-class="form-input" data-dp-placeholder="Open-ended">
                                                <label class="form-label">Effective To <span class="text-base-content/50">(optional)</span></label>
                                            </div>
                                            <div style="flex:1; min-width:14rem;">
                                                <label class="form-label">Reason <span class="text-base-content/50">(optional)</span></label>
                                                <input type="text" class="form-input" x-model="delegateForm.reason" placeholder="e.g. travelling, on leave">
                                            </div>
                                        </div>

                                        <div x-show="myGovDelegationSlots().length > 0">
                                            <button type="button" :class="NSS.govBodyButtonClass()" @click="startDelegateConfirm()">Assign</button>
                                        </div>
                                    </div>

                                    <!-- ── Confirmation stage (owner ask #4; table preview, owner feedback 2026-10-23) ──
                                         ONE combined table listing every selected person
                                         (owner ask #1, 2026-10-24). It spans several
                                         governance bodies, so the wrapper deliberately keeps
                                         the neutral violet `gov-body-table` default rather
                                         than picking one body's colour arbitrarily; the
                                         per-body colour still shows up row by row, on each
                                         row's delegated-position badge and body name. -->
                                    <div x-show="myGovDelegationsView === 'current' && delegateForm.stage === 'confirm'" x-cloak class="mt-4 flex flex-col gap-3">
                                        <div class="alert-msg alert-error" style="margin:0;" x-show="delegateForm.error" x-text="delegateForm.error"></div>
                                        <div class="overflow-x-auto bg-violet-100 rounded-xl shadow-sm gov-body-table">
                                            <table class="table table-sm">
                                                <thead>
                                                    <tr>
                                                        <th>Acting Person</th>
                                                        <th>Sangha Sevi ID</th>
                                                        <th>Position Being Delegated</th>
                                                        <th>Governance Body</th>
                                                        <th>Effective From</th>
                                                        <th>Effective To</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template x-for="row in myGovConfirmRows()" :key="row.key">
                                                        <tr>
                                                            <td class="font-medium" x-text="row.person_name || '—'"></td>
                                                            <td class="font-mono text-sm" x-text="row.sangha_sevi_id || '—'"></td>
                                                            <td><span class="badge badge-sm" :class="NSS.positionBadgeClass(row.my_position_code)" x-text="row.my_position_name"></span></td>
                                                            <td :class="NSS.govBodyTitleClass(row.body_type_code)" x-text="row.body_name || '—'"></td>
                                                            <td x-text="delegateForm.effective_from || '—'"></td>
                                                            <td x-text="delegateForm.effective_to || 'Open-ended'"></td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                        <p class="text-xs text-base-content/60" x-show="delegateForm.reason" x-text="'Reason: ' + delegateForm.reason"></p>
                                        <div class="flex gap-2 flex-wrap">
                                            <button type="button" :class="NSS.govBodyButtonClass()" :disabled="delegateForm.saving"
                                                    @click="confirmDelegation()"
                                                    x-text="delegateForm.saving ? 'Saving…' : 'Confirm'"></button>
                                            <button type="button" class="btn-action" :disabled="delegateForm.saving" @click="backToDelegateForm()">Back</button>
                                        </div>
                                    </div>

                                    <!-- ── Existing delegations — split into Current/
                                         History (owner request, 2026-10-25), same
                                         myGovDelegations source, filtered client-side
                                         by myGovDelegationsCurrent()/History(). ── -->
                                    <div class="alert-msg alert-error mt-3" x-show="myGovDelegationsError" x-text="myGovDelegationsError"></div>

                                    <div x-show="myGovDelegationsView === 'current'" class="overflow-x-auto bg-violet-100 rounded-xl shadow-sm mt-4 gov-body-table">
                                        <table class="table table-sm">
                                            <thead>
                                                <tr>
                                                    <th>Position</th>
                                                    <th>Acting Person</th>
                                                    <th>Period</th>
                                                    <th>Status</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template x-for="d in myGovDelegationsCurrent()" :key="d.acting_position_assignment_pk">
                                                    <tr>
                                                        <td>
                                                            <span class="badge badge-sm" :class="NSS.positionBadgeClass(d.position_code)" x-text="d.position_name"></span>
                                                            <div class="text-xs text-base-content/50" x-show="d.body_name" x-text="d.body_name"></div>
                                                        </td>
                                                        <td class="font-medium" x-text="d.person_name || '—'"></td>
                                                        <td class="text-sm" x-text="d.effective_from + (d.effective_to ? ' – ' + d.effective_to : ' – present')"></td>
                                                        <td><span class="badge badge-sm" :class="NSS.actingStatusBadgeClass(d.acting_status) || 'badge-success'" x-text="d.acting_status"></span></td>
                                                        <td>
                                                            <button class="btn-action danger" style="padding: 0.15rem 0.6rem; font-size: 0.72rem;"
                                                                    @click="endMyDelegation(d)">End</button>
                                                        </td>
                                                    </tr>
                                                </template>
                                                <tr x-show="myGovDelegationsCurrent().length === 0">
                                                    <td colspan="5" class="text-center text-base-content/50 py-6">You have no current delegations.</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>

                                    <div x-show="myGovDelegationsView === 'history'" class="mt-4 flex flex-col gap-4">
                                        <template x-for="grp in myGovDelegationsHistoryGroups()" :key="grp.body_master_pk">
                                            <div class="overflow-x-auto bg-violet-100 rounded-xl shadow-sm gov-body-table">
                                                <div class="px-3 pt-2 text-sm font-semibold text-base-content/70" x-text="grp.body_name"></div>
                                                <table class="table table-sm">
                                                    <thead>
                                                        <tr>
                                                            <th>Position</th>
                                                            <th>Acting Person</th>
                                                            <th>Period</th>
                                                            <th>Status</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template x-for="d in grp.rows" :key="d.acting_position_assignment_pk">
                                                            <tr>
                                                                <td>
                                                                    <span class="badge badge-sm" :class="NSS.positionBadgeClass(d.position_code)" x-text="d.position_name"></span>
                                                                </td>
                                                                <td class="font-medium" x-text="d.person_name || '—'"></td>
                                                                <td class="text-sm" x-text="d.effective_from + (d.effective_to ? ' – ' + d.effective_to : ' – present')"></td>
                                                                <td><span class="badge badge-sm" :class="NSS.actingStatusBadgeClass(d.acting_status) || 'badge-muted'" x-text="d.acting_status"></span></td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>
                                        <div class="overflow-x-auto bg-violet-100 rounded-xl shadow-sm gov-body-table" x-show="myGovDelegationsHistoryGroups().length === 0">
                                            <table class="table table-sm">
                                                <tbody>
                                                    <tr>
                                                        <td class="text-center text-base-content/50 py-6">No past delegations yet.</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div style="display: flex; align-items: center; justify-content: center; padding: 1.5rem;" x-show="govLoading">
                            <div class="spinner"></div>
                        </div>
                        <div class="alert-msg alert-error" x-show="govError" x-text="govError"></div>

                        <template x-if="!govLoading && !govError">
                            <div>
                                <div x-show="govLoaded && !govBodies.length && !(mySakhaBodies && mySakhaBodies.length)" class="placeholder-card">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0 0 12 9.75c-2.551 0-5.056.2-7.5.582V21" />
                                    </svg>
                                    <h3>Governance Bodies</h3>
                                    <p>No governance bodies are available to view yet.</p>
                                </div>

                                <!-- Items 9 + 4: ONE banner per board — name + meta +
                                     members inline (capped at govMemberCap = 9). Grouped
                                     into the NSS-wide boards (national-bodies) and the
                                     member's own Sakha boards (my-sakha-bodies). Only the
                                     Advisory Board exceeds the cap and gets "Show all". -->
                                <template x-for="grp in govBodyGroups()" :key="'grp-' + grp.key">
                                    <div class="mb-8" x-show="grp.bodies.length">
                                        <h2 class="text-lg font-semibold mb-3" x-text="grp.label"></h2>

                                        <template x-for="b in grp.bodies" :key="grp.key + '-' + b.body_master_pk">
                                            <!-- GOV-BODY-CARD:START — shared governance-body card markup.
                                                 This block is kept IDENTICAL (modulo indentation) in dashboard.html's
                                                 Governance tab, dashboard.html's embedded org-dashboard Governance
                                                 section, and admin.html's embedded org-dashboard Governance section.
                                                 This project has no HTML component/include mechanism, so identity is
                                                 enforced by tests/ui/test_ui_governance_card.py instead — if you edit
                                                 one copy you MUST edit all three. Colours/classes bind to the
                                                 NSS.GOV_BODY_* constants in nss-config.js, never hand-written
                                                 literals, so a theme change stays a one-line edit there. -->
                                            <div :class="NSS.govBodyCardClass(b.body_type_code)" class="mb-6">
                                                <div class="card-body p-5">
                                                    <div class="flex items-start justify-between gap-2 flex-wrap">
                                                        <h3 :class="NSS.govBodyTitleClass(b.body_type_code)" x-text="b.body_name"></h3>
                                                        <span class="badge badge-sm" x-show="b.scope_label"
                                                              :class="b.scope_label === 'NSS-wide' ? 'badge-muted' : 'badge-identity'"
                                                              x-text="b.scope_label"></span>
                                                    </div>
                                                    <div class="flex items-center gap-2 flex-wrap mt-1">
                                                        <span class="text-sm" x-text="(b.member_count || 0) + ((b.member_count || 0) === 1 ? ' member' : ' members')"></span>
                                                        <span class="badge badge-sm" :class="NSS.statusBadgeClass(b.body_status)" x-text="b.body_status"></span>
                                                    </div>
                                                    <p class="text-xs text-base-content/60 mt-1" x-show="b.body_type_name" x-text="b.body_type_name"></p>
                                                    <p class="text-xs text-base-content/50 mt-1" x-show="b.organization_name" x-text="b.organization_name"></p>
                                                    <template x-if="b.liveElection">
                                                        <div class="mt-2">
                                                            <span class="badge badge-sm badge-attention" x-text="'Live election: ' + (b.liveElection.election_name || b.liveElection.election_code)"></span>
                                                        </div>
                                                    </template>
                                                    <div :class="NSS.govBodyTableClass(b.body_type_code)" class="mt-3">
                                                        <table class="table table-sm">
                                                            <thead>
                                                                <tr>
                                                                    <th>Position</th>
                                                                    <th>Name</th>
                                                                    <th>Sangha Sevi ID</th>
                                                                    <th>Sakha</th>
                                                                    <th>Anchalika / Zilla</th>
                                                                    <th>Since</th>
                                                                    <th>Term Ends</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                <template x-for="(m, i) in govBodyDisplayMembers(b)" :key="b.body_master_pk + '-' + i">
                                                                    <tr>
                                                                        <td>
                                                                            <span class="badge badge-sm" :class="NSS.positionBadgeClass(m.position_code)" x-text="m.position_name"></span>
                                                                            <span class="badge badge-xs badge-identity ml-1" x-show="m.is_inherited">ex-officio</span>
                                                                        </td>
                                                                        <td class="font-medium">
                                                                            <span x-text="m.person_name || (m.is_inherited ? 'Vacant' : '—')"></span>
                                                                            <span class="text-xs text-base-content/50 italic" x-show="m.acting_person_name">Absent — Acting: <span x-text="m.acting_person_name"></span></span>
                                                                        </td>
                                                                        <td class="font-mono text-sm" x-text="m.sangha_sevi_id || '—'"></td>
                                                                        <td x-text="m.sakha_name || '—'"></td>
                                                                        <td x-text="m.anchalika_zilla_name || '—'"></td>
                                                                        <td x-text="NSS.govMonthYear(m.effective_from)"></td>
                                                                        <td x-text="NSS.govMonthYear(m.effective_to)"></td>
                                                                    </tr>
                                                                </template>
                                                                <tr x-show="!(b.members && b.members.length)">
                                                                    <td colspan="7" class="text-center text-base-content/50 py-6">No current members on record for this body.</td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                    <div class="mt-3" x-show="govBodyHasMore(b)">
                                                        <button type="button" :class="NSS.govBodyButtonClass(b.body_type_code)" @click="openGovAllMembers(b)"
                                                                x-text="'Show all ' + (b.members ? b.members.length : 0) + ' members'"></button>
                                                    </div>
                                                </div>
                                            </div>
                                            <!-- GOV-BODY-CARD:END -->
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Item 9: Advisory Board "Show all" — full member list with a
                             Sakha-name filter (client-side over the loaded members). -->
                        <template x-if="govAllMembers.open">
                            <div style="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;">
                                <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);" @click="closeGovAllMembers()"></div>
                                <div style="position:relative;width:100%;max-width:820px;max-height:85vh;display:flex;flex-direction:column;background:#fff;border-radius:0.75rem;box-shadow:0 20px 60px rgba(0,0,0,0.15);overflow:hidden;">
                                    <div style="display:flex;align-items:center;gap:0.65rem;padding:1rem 1.25rem;border-bottom:1px solid #f1f5f9;">
                                        <div style="flex:1;min-width:0;">
                                            <h3 style="margin:0;font-size:0.95rem;font-weight:700;color:#1B2A4A;" x-text="govAllMembers.body ? govAllMembers.body.body_name : ''"></h3>
                                            <p style="margin:0.1rem 0 0;font-size:0.72rem;color:#6b7280;" x-text="govAllMembersFiltered().length + ' of ' + (govAllMembers.body && govAllMembers.body.members ? govAllMembers.body.members.length : 0) + ' members'"></p>
                                        </div>
                                        <button @click="closeGovAllMembers()" style="background:none;border:none;cursor:pointer;color:#94a3b8;padding:0.25rem;flex-shrink:0;">

                                 flagged honestly as a first version rather than a built

                            <template x-if="at.roleCode === 'NSS_ERP_REPORT_VIEWER'">

                                                <tr style="border-bottom:1px solid #f3f4f6;">
                                                    <td style="padding:0.4rem 0.6rem;color:#6b7280;">Families</td>
