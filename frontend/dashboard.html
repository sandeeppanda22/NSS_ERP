                                    <div class="stat bg-cyan-50 rounded-xl p-4">
                                        <div class="stat-figure text-cyan-500">
                                            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zM9 7c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm4 10H5v-1c0-1.33 2.67-2 4-2s4 .67 4 2v1zm3.85-4h1.64L21 16l-1.99 1.99c-.92-.61-1.71-1.45-2.16-2.49H16v-2h.85zM19 9.5V11h-2V9.5h2z"/></svg>
                                        </div>
                                        <div class="stat-title text-xs text-base-content/60">Parichay Patra Holders</div>
                                        <div class="stat-value text-2xl text-cyan-700" x-text="statNum(parichayPatraTotal)"></div>
                                    </div>
                                    <div class="stat bg-violet-50 rounded-xl p-4">
                                        <div class="stat-figure text-violet-500">
                                            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                                        </div>
                                        <div class="stat-title text-xs text-base-content/60">Darshaks (Probationary)</div>
                                        <div class="stat-value text-2xl text-violet-700" x-text="statNum(darshakTotal)"></div>
                                    </div>
                                    <div class="stat bg-green-50 rounded-xl p-4">
                                        <div class="stat-figure text-green-500">
                                            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                                        </div>
                                        <div class="stat-title text-xs text-base-content/60">Families</div>
                                        <div class="stat-value text-2xl text-green-700" x-text="childFamilyTotal"></div>
                                    </div>
                                </div>

                                <h2 class="text-lg font-semibold mb-3">Constituent Bodies</h2>
                                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 mb-8">
                                    <div class="bg-orange-50 rounded-xl p-4 text-center">
                                        <div class="text-2xl font-bold text-orange-700" x-text="statNum(anchalikaCount)"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Anchalika Sanghas</div>
                                    </div>
                                    <div class="bg-amber-50 rounded-xl p-4 text-center">
                                        <div class="text-2xl font-bold text-amber-700" x-text="statNum(zillaCount)"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Zilla Sanghas</div>
                                    </div>
                                    <div class="bg-rose-50 rounded-xl p-4 text-center">
                                        <div class="text-2xl font-bold text-rose-700" x-text="statNum(sakhaCount)"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Sakha Sanghas</div>
                                    </div>
                                    <div class="bg-teal-50 rounded-xl p-4 text-center">
                                        <div class="text-2xl font-bold text-teal-700" x-text="statNum(pathaChakraCount)"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Patha Chakras</div>
                                    </div>
                                    <div class="bg-lime-50 rounded-xl p-4 text-center">
                                        <div class="text-2xl font-bold text-lime-700" x-text="statNum(paribarikCount)"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Paribarik Sanghas</div>
                                    </div>
                                    <div class="bg-fuchsia-50 rounded-xl p-4 text-center">
                                        <div class="text-2xl font-bold text-fuchsia-700" x-text="statNum(kumariCount)"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Kumari Sanghas</div>
                                    </div>
                                    <div class="bg-pink-50 rounded-xl p-4 text-center">
                                        <div class="text-2xl font-bold text-pink-700" x-text="statNum(mahilaCount)"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Mahila Sanghas</div>
                                    </div>
                                    <div class="bg-sky-50 rounded-xl p-4 text-center">
                                        <div class="text-2xl font-bold text-sky-700" x-text="statNum(sevakCount)"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Sevak Sanghas</div>
                                    </div>
                                </div>

                                <h2 class="text-lg font-semibold mb-3">Membership and Renewal</h2>
                                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-8">
                                    <div class="card bg-amber-50 border border-amber-200">
                                        <div class="card-body p-4">
                                            <div class="flex items-center gap-2 mb-2">
                                                <svg class="w-5 h-5 text-amber-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                                                <h3 class="font-semibold text-amber-800">Renewal Status</h3>
                                            </div>
                                            <p class="text-sm text-base-content/50">Not tracked yet</p>
                                            <div class="mt-2">
                                                <span class="badge badge-muted badge-sm">Not implemented</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card bg-sky-50 border border-sky-200">
                                        <div class="card-body p-4">
                                            <div class="flex items-center gap-2 mb-2">
                                                <svg class="w-5 h-5 text-sky-600" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                                                <h3 class="font-semibold text-sky-800">Weekly Attendance</h3>
                                            </div>
                                            <p class="text-sm text-base-content/50">Not tracked yet</p>
                                            <div class="mt-2">
                                                <span class="badge badge-muted badge-sm">Not implemented</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card bg-blue-50 border border-blue-200">
                                        <div class="card-body p-4">
                                            <div class="flex items-center gap-2 mb-2">
                                                <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                                                <h3 class="font-semibold text-blue-800">Darshak</h3>
                                            </div>
                                            <p class="text-sm">Probationary Members: <strong x-text="statNum(darshakTotal)"></strong></p>
                                            <div class="text-xs text-base-content/50 mt-1">
                                                Aggregated across every Sakha in this Kendra. Card-holders visiting
                                                another Sakha as Darshaks are counted at their home Sakha only —
                                                open that Sakha's dashboard for its visiting-Darshak figure.
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <h2 class="text-lg font-semibold mb-3">Governance</h2>
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                    <div class="card bg-violet-50 border border-violet-200">
                                        <div class="card-body p-4">
                                            <h3 class="font-semibold text-violet-800">Governing Body</h3>
                                            <p class="text-sm text-base-content/50">Not implemented yet (Tier 6)</p>
                                        </div>
                                    </div>
                                    <div class="card bg-emerald-50 border border-emerald-200">
                                        <div class="card-body p-4">
                                            <h3 class="font-semibold text-emerald-800">Advisory Board</h3>
                                            <p class="text-sm text-base-content/50">Not implemented yet (Tier 6)</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- PATHA CHAKRA TIER -->
                            <!-- Patha Chakra (Study Circle) is a leaf org type parented directly
                                 under Kendra — it has no descendant orgs, so it cannot reuse the
                                 children-stats-driven Anchalika/Zilla/Kendra layout above. No
                                 study-circle attendance/session module exists yet (same honest-
                                 placeholder pattern used for Renewal/Attendance elsewhere in this
                                 file), so this tier shows org identity only. -->
                            <div x-show="isPathaChakra">
                                <h1 class="text-2xl font-bold mb-1" x-text="'Patha Chakra Dashboard — ' + org?.organization_name"></h1>
                                <p class="text-sm text-base-content/60 mb-6">
                                    <span x-show="org?.parent_organization_name">Kendra: <span x-text="org?.parent_organization_name"></span></span>
                                    <span x-show="!org?.parent_organization_name">&nbsp;</span>
                                </p>

                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                                    <div class="stat bg-indigo-50 rounded-xl p-4">
                                        <div class="stat-title text-xs text-base-content/60">Organization Code</div>
                                        <div class="stat-value text-2xl text-indigo-700" x-text="org?.organization_code || '—'"></div>
                                    </div>
                                    <div class="stat bg-green-50 rounded-xl p-4">
                                        <div class="stat-title text-xs text-base-content/60">Status</div>
                                        <div class="stat-value text-2xl text-green-700" x-text="org?.status_name || '—'"></div>
                                    </div>
                                    <div class="stat bg-orange-50 rounded-xl p-4">
                                        <div class="stat-title text-xs text-base-content/60">Type</div>
                                        <div class="stat-value text-2xl text-orange-700" x-text="org?.organization_type_name || '—'"></div>
                                    </div>
                                </div>

                                <h2 class="text-lg font-semibold mb-3">Membership</h2>
                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-2">
                                    <div class="rounded-xl p-4 text-center bg-indigo-50">
                                        <div class="text-3xl font-bold text-indigo-700" x-text="orgMemberTotal"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Total Members</div>
                                    </div>
                                    <div class="rounded-xl p-4 text-center bg-cyan-50">
                                        <div class="text-3xl font-bold text-cyan-700" x-text="statNum(parichayPatraTotal)"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Total Parichay Patra</div>
                                    </div>
                                    <div class="rounded-xl p-4 text-center bg-purple-50">
                                        <div class="text-3xl font-bold text-purple-700" x-text="statNum(darshakTotal)"></div>
                                        <div class="text-xs text-base-content/60 mt-1">Total Darshak</div>
                                    </div>
                                </div>
                                <p class="text-xs text-base-content/50 mb-8">
                                    A Patha Chakra is a study circle directly under the Kendra — it has no branch
                                    organizations and members are registered at a Sakha Sangha, never at a Patha
                                    Chakra. These figures are therefore structurally zero by design, not a sign of
                                    missing registrations. Per-session participation needs the study-circle
                                    attendance module below, which does not exist yet.
                                </p>

                                <div class="card bg-sky-50 border border-sky-200">
                                    <div class="card-body p-4">
                                        <div class="flex items-center gap-2 mb-2">
                                            <svg class="w-5 h-5 text-sky-600" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                                            <h3 class="font-semibold text-sky-800">Study Circle Sessions &amp; Attendance</h3>
                                        </div>
                                        <p class="text-sm text-base-content/50">Not tracked yet — no session/attendance module exists for Patha Chakra.</p>
                                        <div class="mt-2">
                                            <span class="badge badge-muted badge-sm">Not implemented</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- MAHILA PARICHALANA MANDALI TIER -->
                            <!-- Anchored on the MAHILA_SANGHA organization, because the
                                 Mahila Parichalana Mandali is that Sangha's governing body
                                 (MAH-091: one body, two names — Mandali / Mahila Governing
                                 Body), not an organization type of its own. Parent = Kendra
                                 means the central Mahila Sangha; parent = Sakha Sangha means
                                 a local one. No mahila or governance DDL module exists yet,
                                 so composition and membership are honest placeholders. -->
                            <div x-show="isMahila">
                                <h1 class="text-2xl font-bold mb-1" x-text="'Mahila Parichalana Mandali — ' + org?.organization_name"></h1>
                                <p class="text-sm text-base-content/60 mb-6">
                                    <span x-show="org?.parent_organization_name">
                                        <span x-text="isCentralMahila ? 'Kendra' : 'Sakha Sangha'"></span>:
                                        <span x-text="org?.parent_organization_name"></span>
                                    </span>
                                    <span x-show="!org?.parent_organization_name">&nbsp;</span>
                                </p>

                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                                    <div class="stat bg-pink-50 rounded-xl p-4">
                                        <div class="stat-title text-xs text-base-content/60">Organization Code</div>
                                        <div class="stat-value text-2xl text-pink-700" x-text="org?.organization_code || '—'"></div>
                                    </div>
                                    <div class="stat bg-green-50 rounded-xl p-4">
                                        <div class="stat-title text-xs text-base-content/60">Status</div>
                                        <div class="stat-value text-2xl text-green-700" x-text="org?.status_name || '—'"></div>
                                    </div>
                                    <div class="stat bg-purple-50 rounded-xl p-4">
                                        <div class="stat-title text-xs text-base-content/60">Scope</div>
                                        <div class="stat-value text-2xl text-purple-700" x-text="isCentralMahila ? 'Central' : 'Local'"></div>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="card bg-rose-50 border border-rose-200">
                                        <div class="card-body p-4">
                                            <h3 class="font-semibold text-rose-800 mb-2">Parichalana Mandali Composition</h3>
                                            <p class="text-sm text-base-content/50">Not tracked yet — no governance-body module exists, so office bearers and terms cannot be shown.</p>
                                            <div class="mt-2">
                                                <span class="badge badge-muted badge-sm">Not implemented</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card bg-sky-50 border border-sky-200">
                                        <div class="card-body p-4">
                                            <h3 class="font-semibold text-sky-800 mb-2">Mahila Membership</h3>
                                            <p class="text-sm text-base-content/50">Not tracked yet — Mahila Sangha membership is not linked in the membership module.</p>
                                            <div class="mt-2">
                                                <span class="badge badge-muted badge-sm">Not implemented</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                        </template>
                    </div>
                    </template>

                </div>
            </template>

        </div>
    </div>

    <script src="/assets/js/dashboard.js"></script>
</body>
</html>
