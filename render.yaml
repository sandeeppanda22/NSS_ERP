# render.yaml — Render.com Infrastructure-as-Code
# Defines the NSS ERP web service (Tiers 0–6: Bootstrap, Foundation,
# Organization, Person, Family/Membership, Authentication + Administration,
# Governance, Correspondence, Attendance, Sakha re-parenting).
#
# Database is hosted on Neon.dev (per TECH_STACK_DECISIONS.md §1).
# DB credentials are set as environment variables in the Render
# dashboard, pointing to the Neon PostgreSQL instance.
#
# Docs: https://docs.render.com/infrastructure-as-code

services:
  - type: web
    name: nss-erp
    runtime: python
    plan: free
    buildCommand: ./render_build.sh
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      # DB_NAME / DB_USER are not secrets — pinned here so the deploy
      # always targets the Neon `nss_erp` database as role `nss_db_owner`.
      # The database and this role MUST already exist in Neon (see note
      # below); DB_PASSWORD/DB_HOST/DB_PORT stay dashboard-set secrets.
      - key: DB_NAME
        value: nss_erp
      - key: DB_USER
        value: nss_db_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DATABASE_URL
        sync: false
      # Python 3.14.x on Render (owner decision 2026-11-09, reverses the 2026-11-03
      # same-minor rule for DEPLOY only; dev stays on 3.15.2 per .python-version).
      # Why: on 3.15.2 the 2026-11-09 build found no cp315 wheel for pydantic_core
      # and psycopg2-binary, fell back to source builds, and failed (pydantic_core
      # needs Rust; Render's cargo registry is read-only). PYTHON_VERSION takes
      # precedence over .python-version. Revisit when those pins ship cp315 wheels.
      - key: PYTHON_VERSION
        value: "3.14.0"
      # Tier 5: Authentication + Administration
      - key: JWT_SECRET_KEY
        sync: false
      # Not a secret — the app's write pool connects as nss_db_writer.
      - key: DB_WRITE_USER
        value: nss_db_writer
      - key: DB_WRITE_PASSWORD
        sync: false
